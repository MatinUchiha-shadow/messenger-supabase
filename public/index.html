<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>چت روم</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg-deep:#0a0a0f;--bg-base:#101018;--bg-elevated:#16161f;--bg-surface:#1c1c28;
      --bg-hover:#222233;--bg-active:#2a2a3d;--accent:#5E6AD2;--accent-hover:#7B85E0;
      --accent-dim:rgba(94,106,210,.15);--green:#22c55e;--green-dim:rgba(34,197,94,.15);
      --red:#ef4444;--red-dim:rgba(239,68,68,.15);--yellow:#f59e0b;--yellow-dim:rgba(245,158,11,.15);
      --text:#ededef;--text2:#8a8f98;--text3:#555566;--border:rgba(255,255,255,.06);
      --border2:rgba(255,255,255,.1);--shadow:0 8px 32px rgba(0,0,0,.4);--radius:12px;--radius-lg:16px;
    }
    html,body{height:100%;overflow:hidden}
    body{font-family:'Vazirmatn',system-ui,sans-serif;background:var(--bg-deep);color:var(--text);-webkit-font-smoothing:antialiased}

    /* ANIMATIONS */
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    @keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    @keyframes glow{0%,100%{box-shadow:0 0 0 0 var(--accent)}50%{box-shadow:0 0 0 6px var(--accent-dim)}}
    @keyframes scaleIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
    @keyframes typing{0%,80%,100%{transform:scale(.6);opacity:.3}40%{transform:scale(1);opacity:1}}
    @keyframes ripple{to{transform:scale(4);opacity:0}}

    /* AUTH SCREEN */
    #auth{display:flex;align-items:center;justify-content:center;height:100vh;background:var(--bg-deep);position:relative;overflow:hidden}
    #auth::before{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle,var(--accent-dim) 0%,transparent 70%);top:-200px;left:-200px;pointer-events:none}
    #auth::after{content:'';position:absolute;width:400px;height:400px;background:radial-gradient(circle,var(--green-dim) 0%,transparent 70%);bottom:-100px;right:-100px;pointer-events:none}
    .auth-card{background:var(--bg-elevated);padding:40px 32px;border-radius:var(--radius-lg);width:92%;max-width:400px;animation:scaleIn .4s;border:1px solid var(--border);position:relative;z-index:1}
    .auth-brand{text-align:center;margin-bottom:28px}
    .auth-brand .logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--accent),#7B85E0);display:inline-flex;align-items:center;justify-content:center;font-size:28px;color:#fff;margin-bottom:12px;box-shadow:0 8px 24px rgba(94,106,210,.3)}
    .auth-brand h1{font-size:24px;font-weight:700;margin-bottom:4px}
    .auth-brand p{font-size:13px;color:var(--text2)}
    .auth-tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--bg-deep);padding:4px;border-radius:10px}
    .auth-tab{flex:1;padding:10px;border:none;background:transparent;color:var(--text2);border-radius:8px;cursor:pointer;font:500 13px inherit;transition:all .2s}
    .auth-tab.active{background:var(--accent);color:#fff}
    .auth-tab:hover:not(.active){color:var(--text)}
    .auth-form{display:none;flex-direction:column;gap:10px}
    .auth-form.active{display:flex}
    .form-group{display:flex;flex-direction:column;gap:4px}
    .form-group label{font-size:12px;color:var(--text2);font-weight:500}
    .form-group input{padding:12px 14px;border:1px solid var(--border2);border-radius:10px;background:var(--bg-deep);color:var(--text);font:14px inherit;transition:all .2s;outline:none}
    .form-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
    .form-group input::placeholder{color:var(--text3)}
    .btn{padding:12px;border:none;border-radius:10px;font:600 14px inherit;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
    .btn:active{transform:scale(.98)}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-primary:hover{background:var(--accent-hover);box-shadow:0 4px 16px rgba(94,106,210,.3)}
    .auth-msg{text-align:center;margin-top:8px;font-size:12px;min-height:18px;transition:all .2s}
    .auth-msg.err{color:var(--red)}
    .auth-msg.ok{color:var(--green)}
    .auth-msg.load{color:var(--yellow)}

    /* APP LAYOUT */
    #app{display:none;height:100vh;width:100vw}
    #app.show{display:flex}

    /* SIDEBAR */
    .sidebar{width:280px;background:var(--bg-base);border-left:1px solid var(--border);display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:60}
    .sb-header{padding:16px;border-bottom:1px solid var(--border)}
    .sb-user{display:flex;align-items:center;gap:10px}
    .avatar{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#7B85E0);display:flex;align-items:center;justify-content:center;font:700 16px sans-serif;color:#fff;flex-shrink:0}
    .avatar.sm{width:32px;height:32px;border-radius:8px;font-size:13px}
    .avatar.xs{width:24px;height:24px;border-radius:6px;font-size:10px}
    .sb-info{flex:1;min-width:0}
    .sb-name{font:600 13px inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sb-role{font-size:10px;padding:2px 8px;border-radius:6px;display:inline-block;margin-top:2px}
    .sb-role.owner{background:var(--accent-dim);color:var(--accent)}
    .sb-role.admin{background:var(--yellow-dim);color:var(--yellow)}
    .sb-role.user{background:var(--bg-hover);color:var(--text2)}
    .sb-body{flex:1;overflow-y:auto;padding:12px 8px}
    .sb-body::-webkit-scrollbar{width:4px}
    .sb-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
    .sb-section{margin-bottom:16px}
    .sb-section-head{display:flex;justify-content:space-between;align-items:center;padding:0 8px;margin-bottom:6px}
    .sb-section-title{font:600 10px inherit;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
    .btn-add{width:20px;height:20px;border:none;background:transparent;color:var(--text3);border-radius:6px;cursor:pointer;font:12px inherit;display:none;align-items:center;justify-content:center;transition:all .2s}
    .btn-add.show{display:flex}
    .btn-add:hover{background:var(--accent);color:#fff}
    .room-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:all .15s;margin-bottom:1px;color:var(--text2)}
    .room-item:hover{background:var(--bg-hover);color:var(--text)}
    .room-item.active{background:var(--accent-dim);color:var(--accent)}
    .room-item i{width:16px;text-align:center;font-size:13px;opacity:.7}
    .room-item.active i{opacity:1}
    .room-item span{flex:1;font:500 13px inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .online-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;font:13px inherit}
    .online-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 6px var(--green)}
    .online-name{color:var(--text2);font-size:12px}
    .sb-footer{padding:12px;border-top:1px solid var(--border)}
    .btn-logout{width:100%;padding:10px;border:none;border-radius:8px;background:var(--red-dim);color:var(--red);font:500 12px inherit;cursor:pointer;transition:all .2s}
    .btn-logout:hover{background:var(--red);color:#fff}

    /* MAIN */
    .main{flex:1;display:flex;flex-direction:column;background:var(--bg-deep);min-width:0}

    /* WELCOME */
    .welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text2);gap:16px}
    .welcome-icon{width:80px;height:80px;border-radius:24px;background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;font-size:36px;border:1px solid var(--border)}

    /* CHAT */
    .chat{display:none;flex-direction:column;flex:1;min-width:0}
    .chat.show{display:flex}
    .chat-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--bg-base);gap:12px}
    .chat-title{display:flex;align-items:center;gap:10px;min-width:0}
    .chat-title h2{font:600 15px inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .chat-badge{font-size:10px;padding:3px 8px;border-radius:6px;background:var(--bg-hover);color:var(--text2)}
    .chat-badge.voice{background:var(--green-dim);color:var(--green)}
    .chat-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
    .btn-sm{padding:8px 14px;border:none;border-radius:8px;font:500 12px inherit;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
    .btn-sm:active{transform:scale(.96)}
    .btn-green{background:var(--green-dim);color:var(--green)}
    .btn-green:hover{background:var(--green);color:#fff}
    .btn-red{background:var(--red-dim);color:var(--red)}
    .btn-red:hover{background:var(--red);color:#fff}
    .btn-icon{width:34px;height:34px;border:none;background:var(--bg-surface);color:var(--text2);border-radius:8px;cursor:pointer;font:14px inherit;transition:all .2s;display:flex;align-items:center;justify-content:center}
    .btn-icon:hover{background:var(--bg-hover);color:var(--text)}

    /* MESSAGES */
    .messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:6px}
    .messages::-webkit-scrollbar{width:5px}
    .messages::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
    .msg-group{display:flex;gap:10px;animation:slideUp .2s}
    .msg-group.own{flex-direction:row-reverse}
    .msg-avatar{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:700 13px sans-serif;color:#fff;flex-shrink:0}
    .msg-content{max-width:65%;min-width:0}
    .msg-bubble{padding:10px 14px;border-radius:var(--radius);border-top-right-radius:4px;background:var(--bg-surface);border:1px solid var(--border);transition:background .15s}
    .msg-group.own .msg-bubble{background:var(--accent);border-color:transparent;border-top-right-radius:var(--radius);border-top-left-radius:4px}
    .msg-meta{display:flex;align-items:center;gap:6px;margin-bottom:3px}
    .msg-author{font:600 12px inherit}
    .msg-role{font-size:9px;padding:1px 5px;border-radius:4px}
    .msg-role.owner{background:var(--accent-dim);color:var(--accent)}
    .msg-role.admin{background:var(--yellow-dim);color:var(--yellow)}
    .msg-time{font-size:10px;color:var(--text3)}
    .msg-text{font:13.5px/1.65 inherit;word-wrap:break-word}
    .msg-image{max-width:260px;max-height:260px;border-radius:8px;margin-top:6px;cursor:pointer;border:1px solid var(--border)}
    .msg-audio{margin-top:6px;max-width:220px}
    .msg-file{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg-deep);border-radius:8px;margin-top:6px;text-decoration:none;color:var(--text);font:12px inherit;transition:all .2s;border:1px solid var(--border)}
    .msg-file:hover{border-color:var(--accent);background:var(--accent-dim)}
    .msg-file i{font-size:18px;color:var(--accent)}
    .msg-file-info{flex:1;min-width:0}
    .msg-file-name{font:500 12px inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .msg-file-size{font-size:10px;color:var(--text3)}

    /* TYPING */
    .typing-bar{padding:4px 20px;font-size:11px;color:var(--text3);display:none;align-items:center;gap:6px;min-height:22px}
    .typing-bar.show{display:flex}
    .typing-dots{display:flex;gap:3px}
    .typing-dots span{width:5px;height:5px;border-radius:50%;background:var(--text3);animation:typing 1.4s infinite ease-in-out}
    .typing-dots span:nth-child(2){animation-delay:.2s}
    .typing-dots span:nth-child(3){animation-delay:.4s}

    /* INPUT */
    .input-area{padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:flex-end;gap:8px;background:var(--bg-base)}
    .input-area textarea{flex:1;padding:11px 14px;border:1px solid var(--border2);border-radius:10px;background:var(--bg-surface);color:var(--text);font:13.5px inherit;resize:none;max-height:100px;transition:border-color .2s;outline:none;line-height:1.5}
    .input-area textarea:focus{border-color:var(--accent)}
    .input-area textarea::placeholder{color:var(--text3)}
    .btn-send{width:40px;height:40px;border:none;border-radius:10px;background:var(--accent);color:#fff;font:14px inherit;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .btn-send:hover{background:var(--accent-hover);box-shadow:0 4px 12px rgba(94,106,210,.3)}
    .btn-send:active{transform:scale(.94)}
    .btn-attach{width:40px;height:40px;border:none;border-radius:10px;background:transparent;color:var(--text3);font:16px inherit;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .btn-attach:hover{color:var(--text);background:var(--bg-surface)}

    /* MEDIA PANEL */
    .media-panel{position:fixed;bottom:16px;left:16px;width:280px;background:var(--bg-elevated);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;z-index:100;animation:slideUp .3s;border:1px solid var(--border)}
    .media-header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
    .media-header h3{font:600 12px inherit;display:flex;align-items:center;gap:6px}
    .media-header h3 i{color:var(--green);font-size:10px;animation:pulse 2s infinite}
    .media-video{width:100%;background:#000;max-height:160px}
    .media-ctrls{padding:10px;display:flex;justify-content:center;gap:8px}
    .btn-media{width:40px;height:40px;border-radius:50%;border:none;background:var(--bg-surface);color:var(--text2);font:14px inherit;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
    .btn-media:hover{background:var(--bg-hover);color:var(--text);transform:scale(1.08)}
    .btn-media.red{background:var(--red);color:#fff}
    .btn-media.red:hover{background:#dc2626}
    .btn-media.green{background:var(--green);color:#fff;animation:glow 2s infinite}

    /* MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:200}
    .modal-overlay.show{display:flex}
    .modal-card{background:var(--bg-elevated);padding:24px;border-radius:var(--radius-lg);width:90%;max-width:360px;border:1px solid var(--border);animation:scaleIn .2s}
    .modal-card h2{font:600 16px inherit;margin-bottom:16px}
    .modal-card input,.modal-card select{width:100%;padding:10px 12px;border:1px solid var(--border2);border-radius:8px;background:var(--bg-deep);color:var(--text);font:13px inherit;margin-bottom:10px;outline:none}
    .modal-card input:focus,.modal-card select:focus{border-color:var(--accent)}
    .modal-btns{display:flex;gap:8px;margin-top:14px}
    .modal-btns .btn{flex:1;padding:10px;font-size:13px}
    .btn-ghost{background:var(--bg-surface);color:var(--text2)}
    .btn-ghost:hover{background:var(--bg-hover);color:var(--text)}

    /* MOBILE */
    .menu-btn{display:none;position:fixed;top:12px;right:12px;z-index:55}
    .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;backdrop-filter:blur(2px)}
    .sidebar-overlay.show{display:block}
    @media(max-width:768px){
      .sidebar{position:fixed;right:0;top:0;height:100%;width:280px;transform:translateX(100%)}
      .sidebar.open{transform:translateX(0)}
      .menu-btn{display:flex}
      .msg-content{max-width:80%}
      .media-panel{width:calc(100% - 32px);left:16px;right:16px}
      .auth-card{padding:28px 20px}
      input,textarea,select{font-size:16px!important}
    }
  </style>
</head>
<body>
  <button class="btn-icon menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- AUTH -->
  <div id="auth">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="logo"><i class="fas fa-comments"></i></div>
        <h1>چت روم</h1>
        <p>گفتگوی آنلاین با دوستان</p>
      </div>
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">ورود</button>
        <button class="auth-tab" data-tab="register">ثبت نام</button>
      </div>
      <form id="loginForm" class="auth-form active">
        <div class="form-group"><label>ایمیل</label><input type="email" id="loginEmail" placeholder="email@example.com" required></div>
        <div class="form-group"><label>رمز عبور</label><input type="password" id="loginPass" placeholder="حداقل ۶ کاراکتر" required></div>
        <button type="submit" class="btn btn-primary">ورود</button>
      </form>
      <form id="registerForm" class="auth-form">
        <div class="form-group"><label>نام کاربری</label><input type="text" id="regUsername" placeholder="username" required></div>
        <div class="form-group"><label>ایمیل</label><input type="email" id="regEmail" placeholder="email@example.com" required></div>
        <div class="form-group"><label>رمز عبور</label><input type="password" id="regPass" placeholder="حداقل ۶ کاراکتر" required minlength="6"></div>
        <div class="form-group"><label>نام نمایشی (اختیاری)</label><input type="text" id="regDisplay" placeholder="نام شما"></div>
        <button type="submit" class="btn btn-primary">ثبت نام</button>
      </form>
      <div id="authMsg" class="auth-msg"></div>
    </div>
  </div>

  <!-- APP -->
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="sb-header">
        <div class="sb-user">
          <div class="avatar" id="myAvatar"></div>
          <div class="sb-info">
            <div class="sb-name" id="myName"></div>
            <span class="sb-role" id="myRole"></span>
          </div>
        </div>
      </div>
      <div class="sb-body">
        <div class="sb-section">
          <div class="sb-section-head">
            <span class="sb-section-title">اتاق‌های متنی</span>
            <button class="btn-add" id="addText"><i class="fas fa-plus"></i></button>
          </div>
          <div id="textRooms"></div>
        </div>
        <div class="sb-section">
          <div class="sb-section-head">
            <span class="sb-section-title">کانال‌های صوتی</span>
            <button class="btn-add" id="addVoice"><i class="fas fa-plus"></i></button>
          </div>
          <div id="voiceRooms"></div>
        </div>
        <div class="sb-section">
          <div class="sb-section-head">
            <span class="sb-section-title">آنلاین</span>
          </div>
          <div id="onlineList"></div>
        </div>
      </div>
      <div class="sb-footer">
        <button class="btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> خروج</button>
      </div>
    </aside>

    <main class="main">
      <div id="welcome" class="welcome">
        <div class="welcome-icon"><i class="fas fa-hand-wave" style="color:var(--accent)"></i></div>
        <h2 style="font-size:20px;font-weight:600">به چت روم خوش اومدی!</h2>
        <p style="font-size:13px;color:var(--text3)">یه اتاق از لیست انتخاب کن</p>
      </div>
      <div id="chat" class="chat">
        <div class="chat-header">
          <div class="chat-title">
            <h2 id="roomTitle"></h2>
            <span class="chat-badge" id="roomBadge"></span>
          </div>
          <div class="chat-actions" id="voiceActions" style="display:none">
            <button class="btn-sm btn-green" id="joinVoice"><i class="fas fa-microphone"></i> ورود</button>
            <button class="btn-sm btn-red" id="leaveVoice" style="display:none"><i class="fas fa-microphone-slash"></i> خروج</button>
            <button class="btn-icon" id="shareScreen" style="display:none" title="اشتراک صفحه"><i class="fas fa-desktop"></i></button>
          </div>
        </div>
        <div id="messages" class="messages"></div>
        <div class="typing-bar" id="typingBar">
          <div class="typing-dots"><span></span><span></span><span></span></div>
          <span id="typingText"></span>
        </div>
        <div id="inputArea" class="input-area">
          <button class="btn-attach" id="uploadBtn" title="فایل"><i class="fas fa-paperclip"></i></button>
          <input type="file" id="fileInput" style="display:none" accept="image/*,audio/*,.zip,.pdf,.txt">
          <textarea id="msgInput" placeholder="پیام بنویسید..." rows="1"></textarea>
          <button class="btn-send" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </main>

    <!-- MEDIA PANEL -->
    <div id="mediaPanel" class="media-panel" style="display:none">
      <div class="media-header">
        <h3><i class="fas fa-circle"></i> تماس صوتی</h3>
        <button class="btn-icon" id="closeMedia" style="width:28px;height:28px;font-size:12px"><i class="fas fa-times"></i></button>
      </div>
      <video id="remoteVideo" class="media-video" autoplay playsinline></video>
      <div class="media-ctrls">
        <button class="btn-media" id="muteBtn" title="بی‌صدا"><i class="fas fa-microphone"></i></button>
        <button class="btn-media red" id="endCall" title="پایان تماس"><i class="fas fa-phone-slash"></i></button>
      </div>
    </div>

    <!-- CREATE ROOM MODAL -->
    <div id="modal" class="modal-overlay">
      <div class="modal-card">
        <h2>ایجاد اتاق جدید</h2>
        <input type="text" id="roomNameInput" placeholder="نام اتاق">
        <select id="roomTypeSelect">
          <option value="text">اتاق متنی</option>
          <option value="voice">کانال صوتی</option>
        </select>
        <div class="modal-btns">
          <button class="btn btn-primary" id="confirmRoom">ایجاد</button>
          <button class="btn btn-ghost" id="cancelRoom">لغو</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ========== CONFIG ==========
    const SB_URL = 'https://dvhjswspljxbjxngetdc.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2aGpzd3NwbGp4Ymp4bmdldGRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4OTA5NDAsImV4cCI6MjEwMDQ2Njk0MH0.HRU4N_JM7mDBQJ2t9t_AfSk8zE-dPz7BecRpop0uxww';
    const db = supabase.createClient(SB_URL, SB_KEY);

    // ========== STATE ==========
    let me = null, curRoom = null, curType = null;
    let myStream = null, voiceChannel = null, presenceChannel = null;
    const peers = new Map();
    const $ = id => document.getElementById(id);

    // ========== AUTH ==========
    async function doRegister() {
      const username = $('regUsername').value.trim();
      const email = $('regEmail').value.trim();
      const password = $('regPass').value;
      const displayName = $('regDisplay').value.trim() || username;
      if (!username || !email || !password) return authMsg('همه فیلدها رو پر کن', 'err');
      authMsg('در حال ثبت نام...', 'load');
      const { data, error } = await db.auth.signUp({ email, password, options: { data: { username, display_name: displayName } } });
      if (error) return authMsg(error.message, 'err');
      // Try auto-login
      const { error: le } = await db.auth.signInWithPassword({ email, password });
      if (le) { authMsg('ثبت نام شد! وارد شو.', 'ok'); switchTab('login'); $('loginEmail').value = email; $('loginPass').value = password; return; }
      // Create profile
      const { count } = await db.from('profiles').select('*', { count: 'exact', head: true });
      await db.from('profiles').insert({ id: data.user.id, username, display_name: displayName, role: count === 0 ? 'owner' : 'user' });
      await loadSession();
    }

    async function doLogin() {
      const email = $('loginEmail').value.trim();
      const password = $('loginPass').value;
      if (!email || !password) return authMsg('ایمیل و رمز رو پر کن', 'err');
      authMsg('در حال ورود...', 'load');
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) return authMsg(error.message, 'err');
      await loadSession();
    }

    async function loadSession() {
      const { data: { user } } = await db.auth.getUser();
      if (!user) { authMsg(''); return; }
      await new Promise(r => setTimeout(r, 200));
      let { data: profile } = await db.from('profiles').select('*').eq('id', user.id).single();
      if (!profile) {
        const { count } = await db.from('profiles').select('*', { count: 'exact', head: true });
        const un = user.user_metadata?.username || user.email.split('@')[0];
        await db.from('profiles').insert({ id: user.id, username: un, display_name: user.user_metadata?.display_name || un, role: count === 0 ? 'owner' : 'user' });
        ({ data: profile } = await db.from('profiles').select('*').eq('id', user.id).single());
      }
      if (profile) { me = profile; showApp(); }
      authMsg('');
    }

    async function doLogout() {
      if (presenceChannel) { await db.removeChannel(presenceChannel); presenceChannel = null; }
      leaveVoice();
      await db.auth.signOut();
      me = null;
      $('auth').style.display = 'flex';
      $('app').classList.remove('show');
    }

    function authMsg(t, c) { const el = $('authMsg'); el.textContent = t; el.className = 'auth-msg ' + (c || ''); }
    function switchTab(t) {
      document.querySelectorAll('.auth-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
      $('loginForm').classList.toggle('active', t === 'login');
      $('registerForm').classList.toggle('active', t === 'register');
      authMsg('');
    }

    // ========== APP UI ==========
    function showApp() {
      $('auth').style.display = 'none';
      $('app').classList.add('show');
      $('myName').textContent = me.display_name || me.username;
      $('myAvatar').textContent = (me.display_name || me.username).charAt(0).toUpperCase();
      const r = $('myRole');
      r.textContent = me.role === 'owner' ? 'مالک' : me.role === 'admin' ? 'ادمین' : 'کاربر';
      r.className = 'sb-role ' + me.role;
      const isAdmin = ['owner', 'admin'].includes(me.role);
      $('addText').classList.toggle('show', isAdmin);
      $('addVoice').classList.toggle('show', isAdmin);
      loadRooms();
      startPresence();
    }

    // ========== PRESENCE ==========
    async function startPresence() {
      if (presenceChannel) await db.removeChannel(presenceChannel);
      presenceChannel = db.channel('online-users');
      presenceChannel.on('presence', { event: 'sync' }, () => renderOnline(presenceChannel.presenceState()))
        .on('presence', { event: 'join' }, () => renderOnline(presenceChannel.presenceState()))
        .on('presence', { event: 'leave' }, () => renderOnline(presenceChannel.presenceState()));
      await presenceChannel.subscribe(async (status) => {
        if (status === 'SUBSCRIBED') {
          await presenceChannel.track({ user_id: me.id, username: me.username, display_name: me.display_name, online_at: new Date().toISOString() });
        }
      });
    }

    function renderOnline(state) {
      const list = $('onlineList');
      list.innerHTML = '';
      const seen = new Set();
      for (const [, presences] of Object.entries(state)) {
        for (const p of presences) {
          if (seen.has(p.user_id)) continue;
          seen.add(p.user_id);
          const d = document.createElement('div');
          d.className = 'online-item';
          const suffix = p.user_id === me.id ? ' (شما)' : '';
          d.innerHTML = `<span class="online-dot"></span><span class="online-name">${esc(p.display_name || p.username)}${suffix}</span>`;
          list.appendChild(d);
        }
      }
    }

    // ========== ROOMS ==========
    async function loadRooms() {
      const { data } = await db.from('rooms').select('*').order('created_at');
      $('textRooms').innerHTML = '';
      $('voiceRooms').innerHTML = '';
      if (!data) return;
      data.forEach(r => {
        const d = document.createElement('div');
        d.className = 'room-item';
        d.dataset.id = r.id;
        const icon = r.type === 'voice' ? '<i class="fas fa-volume-up"></i>' : '<i class="fas fa-comment"></i>';
        d.innerHTML = `${icon}<span>${esc(r.name)}</span>`;
        d.onclick = () => openRoom(r.id, r.name, r.type);
        (r.type === 'voice' ? $('voiceRooms') : $('textRooms')).appendChild(d);
      });
    }

    async function createRoom() {
      const name = $('roomNameInput').value.trim();
      const type = $('roomTypeSelect').value;
      if (!name) return;
      await db.from('rooms').insert({ name, type, created_by: me.id });
      $('modal').classList.remove('show');
      $('roomNameInput').value = '';
      loadRooms();
    }

    // ========== MESSAGES ==========
    let msgSub = null;

    async function openRoom(id, name, type) {
      if (msgSub) { await db.removeChannel(msgSub); msgSub = null; }
      curRoom = id;
      curType = type;
      $('welcome').style.display = 'none';
      $('chat').classList.add('show');
      $('roomTitle').textContent = name;
      const badge = $('roomBadge');
      badge.textContent = type === 'voice' ? 'صوتی' : 'متنی';
      badge.className = 'chat-badge' + (type === 'voice' ? ' voice' : '');
      $('inputArea').style.display = type === 'text' ? 'flex' : 'none';
      $('voiceActions').style.display = type === 'voice' ? 'flex' : 'none';
      document.querySelectorAll('.room-item').forEach(el => el.classList.toggle('active', el.dataset.id === id));
      closeSidebar();

      if (type === 'text') {
        const { data } = await db.from('messages').select('*, profiles:user_id (id, username, display_name, role)').eq('room_id', id).order('created_at').limit(100);
        $('messages').innerHTML = '';
        if (data) data.forEach(m => addMsg(m));
        scrollBottom();
      }

      // Subscribe to new messages
      msgSub = db.channel('room:' + id)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${id}` }, async p => {
          const { data } = await db.from('messages').select('*, profiles:user_id (id, username, display_name, role)').eq('id', p.new.id).single();
          if (data) addMsg(data);
        })
        .subscribe();
    }

    function addMsg(m) {
      const c = $('messages');
      const d = document.createElement('div');
      const own = m.user_id === me.id;
      const u = m.profiles;
      const role = u?.role === 'owner' ? 'مالک' : u?.role === 'admin' ? 'ادمین' : '';
      const roleClass = u?.role || 'user';
      const time = new Date(m.created_at).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });

      let content = '';
      if (m.type === 'text') content = `<div class="msg-text">${esc(m.content)}</div>`;
      else if (m.type === 'image') content = `<img src="${m.file_url}" class="msg-image" loading="lazy">`;
      else if (m.type === 'voice') content = `<audio controls class="msg-audio" src="${m.file_url}"></audio>`;
      else if (m.type === 'file') content = `<a href="${m.file_url}" class="msg-file" target="_blank"><i class="fas fa-file"></i><div class="msg-file-info"><div class="msg-file-name">${esc(m.file_name || 'فایل')}</div>${m.file_size ? `<div class="msg-file-size">${fmtSize(m.file_size)}</div>` : ''}</div></a>`;

      d.className = `msg-group ${own ? 'own' : ''}`;
      d.innerHTML = `<div class="msg-avatar" style="background:${own ? 'var(--accent)' : 'linear-gradient(135deg,var(--green),#16a34a)'}">${(u?.display_name || '?').charAt(0).toUpperCase()}</div><div class="msg-content"><div class="msg-meta"><span class="msg-author">${esc(u?.display_name || 'ناشناس')}</span>${role ? `<span class="msg-role ${roleClass}">${role}</span>` : ''}<span class="msg-time">${time}</span></div><div class="msg-bubble">${content}</div></div>`;
      c.appendChild(d);
      scrollBottom();
    }

    async function sendMsg() {
      const t = $('msgInput').value.trim();
      if (!t || !curRoom) return;
      $('msgInput').value = '';
      $('msgInput').style.height = 'auto';
      await db.from('messages').insert({ room_id: curRoom, user_id: me.id, type: 'text', content: t });
    }

    function scrollBottom() {
      const c = $('messages');
      requestAnimationFrame(() => { c.scrollTop = c.scrollHeight; });
    }

    // ========== UPLOAD ==========
    async function uploadFile(file) {
      const ext = file.name.split('.').pop();
      const name = `${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
      const { error } = await db.storage.from('uploads').upload(name, file);
      if (error) { alert('خطا در آپلود: ' + error.message); return null; }
      const { data } = db.storage.from('uploads').getPublicUrl(name);
      return { url: data.publicUrl, name: file.name, size: file.size };
    }

    // ========== VOICE (WebRTC via Supabase Broadcast) ==========
    async function joinVoice() {
      try {
        myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        $('joinVoice').style.display = 'none';
        $('leaveVoice').style.display = 'inline-flex';
        $('shareScreen').style.display = 'flex';
        $('mediaPanel').style.display = 'block';

        voiceChannel = db.channel('voice:' + curRoom);
        voiceChannel.on('broadcast', { event: 'join' }, async ({ payload }) => {
          if (payload.userId === me.id) return;
          await createPeer(payload.userId, true);
        }).on('broadcast', { event: 'offer' }, async ({ payload }) => {
          if (payload.to !== me.id) return;
          await handleOffer(payload.from, payload.offer);
        }).on('broadcast', { event: 'answer' }, async ({ payload }) => {
          if (payload.to !== me.id) return;
          await handleAnswer(payload.from, payload.answer);
        }).on('broadcast', { event: 'ice' }, async ({ payload }) => {
          if (payload.to !== me.id) return;
          await handleIce(payload.from, payload.candidate);
        }).on('broadcast', { event: 'leave' }, ({ payload }) => {
          if (peers.has(payload.userId)) {
            peers.get(payload.userId).close();
            peers.delete(payload.userId);
          }
        }).subscribe();

        await voiceChannel.send({ type: 'broadcast', event: 'join', payload: { userId: me.id } });
      } catch (e) {
        console.error('Voice error:', e);
        alert('دسترسی به میکروفون رد شد');
      }
    }

    function leaveVoice() {
      if (voiceChannel) {
        voiceChannel.send({ type: 'broadcast', event: 'leave', payload: { userId: me.id } });
        db.removeChannel(voiceChannel);
        voiceChannel = null;
      }
      if (myStream) { myStream.getTracks().forEach(t => t.stop()); myStream = null; }
      peers.forEach(pc => pc.close());
      peers.clear();
      $('joinVoice').style.display = 'inline-flex';
      $('leaveVoice').style.display = 'none';
      $('shareScreen').style.display = 'none';
      $('mediaPanel').style.display = 'none';
      $('remoteVideo').srcObject = null;
    }

    async function createPeer(peerId, initiator) {
      const pc = new RTCPeerConnection({
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      });
      peers.set(peerId, pc);
      if (myStream) myStream.getTracks().forEach(t => pc.addTrack(t, myStream));
      pc.onicecandidate = e => {
        if (e.candidate) voiceChannel.send({ type: 'broadcast', event: 'ice', payload: { from: me.id, to: peerId, candidate: e.candidate } });
      };
      pc.ontrack = e => { $('remoteVideo').srcObject = e.streams[0]; };
      if (initiator) {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        voiceChannel.send({ type: 'broadcast', event: 'offer', payload: { from: me.id, to: peerId, offer } });
      }
      return pc;
    }

    async function handleOffer(from, offer) {
      const pc = await createPeer(from, false);
      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      voiceChannel.send({ type: 'broadcast', event: 'answer', payload: { from: me.id, to: from, answer } });
    }

    async function handleAnswer(from, answer) {
      const pc = peers.get(from);
      if (pc) await pc.setRemoteDescription(new RTCSessionDescription(answer));
    }

    async function handleIce(from, candidate) {
      const pc = peers.get(from);
      if (pc) try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch(e) {}
    }

    async function shareScreen() {
      try {
        const s = await navigator.mediaDevices.getDisplayMedia({ video: true });
        $('remoteVideo').srcObject = s;
        s.getVideoTracks()[0].onended = () => { $('remoteVideo').srcObject = myStream; };
      } catch (e) {}
    }

    function toggleMute() {
      if (!myStream) return;
      const a = myStream.getAudioTracks()[0];
      if (a) {
        a.enabled = !a.enabled;
        $('muteBtn').innerHTML = a.enabled ? '<i class="fas fa-microphone"></i>' : '<i class="fas fa-microphone-slash"></i>';
        $('muteBtn').style.background = a.enabled ? 'var(--bg-surface)' : 'var(--red)';
        $('muteBtn').style.color = a.enabled ? 'var(--text2)' : '#fff';
      }
    }

    // ========== MOBILE ==========
    function closeSidebar() { $('sidebar').classList.remove('open'); $('sidebarOverlay').classList.remove('show'); }

    // ========== HELPERS ==========
    function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
    function fmtSize(b) {
      if (b < 1024) return b + ' B';
      if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
      return (b / 1048576).toFixed(1) + ' MB';
    }

    // ========== EVENTS ==========
    document.addEventListener('DOMContentLoaded', () => {
      // Auth tabs
      document.querySelectorAll('.auth-tab').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
      $('loginForm').onsubmit = e => { e.preventDefault(); doLogin(); };
      $('registerForm').onsubmit = e => { e.preventDefault(); doRegister(); };
      $('logoutBtn').onclick = doLogout;

      // Messages
      $('sendBtn').onclick = sendMsg;
      $('msgInput').addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
      });
      // Auto-resize textarea
      $('msgInput').addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 100) + 'px';
      });

      // File upload
      $('uploadBtn').onclick = () => $('fileInput').click();
      $('fileInput').onchange = async e => {
        if (!e.target.files[0] || !curRoom) return;
        const f = await uploadFile(e.target.files[0]);
        if (f) {
          let t = 'file';
          if (e.target.files[0].type.startsWith('image/')) t = 'image';
          else if (e.target.files[0].type.startsWith('audio/')) t = 'voice';
          await db.from('messages').insert({ room_id: curRoom, user_id: me.id, type: t, content: f.name, file_url: f.url, file_name: f.name, file_size: f.size });
        }
        e.target.value = '';
      };

      // Room creation
      $('addText').onclick = () => { $('roomTypeSelect').value = 'text'; $('modal').classList.add('show'); };
      $('addVoice').onclick = () => { $('roomTypeSelect').value = 'voice'; $('modal').classList.add('show'); };
      $('confirmRoom').onclick = createRoom;
      $('cancelRoom').onclick = () => $('modal').classList.remove('show');
      $('modal').onclick = e => { if (e.target === $('modal')) $('modal').classList.remove('show'); };

      // Voice
      $('joinVoice').onclick = joinVoice;
      $('leaveVoice').onclick = leaveVoice;
      $('shareScreen').onclick = shareScreen;
      $('muteBtn').onclick = toggleMute;
      $('endCall').onclick = leaveVoice;
      $('closeMedia').onclick = leaveVoice;

      // Mobile sidebar
      $('menuBtn').onclick = () => { $('sidebar').classList.add('open'); $('sidebarOverlay').classList.add('show'); };
      $('sidebarOverlay').onclick = closeSidebar;

      // Check session
      loadSession();
    });
  </script>
</body>
</html>
