<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GapChat</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root{
      --bg:#0b0d12;--surface:#13161f;--panel:#1a1e2a;--border:#252a3a;
      --accent:#7c6dfa;--accent2:#fa6d9b;--teal:#2dd4bf;--green:#22c55e;
      --text:#e2e5f0;--muted:#6b7094;--red:#e5334a;
      --bubble-mine:#7c6dfa;--bubble-mine-text:#ffffff;
      --bubble-other:#13161f;--bubble-other-text:#e2e5f0;
      --font:'Vazirmatn',system-ui,sans-serif;--ease:.18s cubic-bezier(.4,0,.2,1);
      --radius:16px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    body{font-family:var(--font);background:var(--bg);color:var(--text);transition:background var(--ease),color var(--ease)}
    button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
    input,textarea{font-family:inherit;outline:none;border:none;background:none;color:inherit}
    ::-webkit-scrollbar{width:3px}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}

    /* ANIMATIONS */
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    @keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes scaleIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    @keyframes glow{0%,100%{box-shadow:0 0 0 0 var(--accent)}50%{box-shadow:0 0 0 6px rgba(124,109,250,.15)}}
    @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
    @keyframes typing{0%,80%,100%{transform:scale(.6);opacity:.3}40%{transform:scale(1);opacity:1}}
    @keyframes sendPop{0%{transform:scale(.85)}50%{transform:scale(1.15) rotate(-12deg)}100%{transform:scale(1)}}
    @keyframes blackholeSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes blackholePulse{0%,100%{text-shadow:0 0 4px rgba(255,106,0,.4)}50%{text-shadow:0 0 12px rgba(255,106,0,.9)}}
    @keyframes bhOrbit{from{offset-distance:0%}to{offset-distance:100%}}
    @keyframes avPop{from{opacity:0;transform:scale(.5) rotate(-15deg)}to{opacity:1;transform:scale(1) rotate(0)}}

    /* ═══════════════════════════════
       BLACK HOLE VISUAL
    ═══════════════════════════════ */
    #blackhole-visual{
      position:fixed;top:50%;left:50%;
      width:min(110vmin,820px);height:min(110vmin,820px);
      transform:translate(-50%,-50%);z-index:0;pointer-events:none;display:none;
    }
    body[data-theme="blackhole"] #blackhole-visual{display:block}
    #blackhole-visual svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
    .bh-ambient{position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(circle,rgba(255,110,30,.10) 0%,rgba(255,70,0,.04) 40%,transparent 68%);animation:bhAmbientPulse 8s ease-in-out infinite}
    @keyframes bhAmbientPulse{0%,100%{opacity:.7}50%{opacity:1}}
    .bh-disk-group{animation:bhShimmer 5s ease-in-out infinite;transform-origin:200px 200px}
    @keyframes bhShimmer{0%,100%{opacity:.85}50%{opacity:1}}
    .bh-hotspots ellipse{offset-path:path("M 5 200 A 195 46 0 1 1 395 200 A 195 46 0 1 1 5 200");animation:bhOrbit 12s linear infinite;mix-blend-mode:screen}
    .bh-hotspots ellipse:nth-child(2){animation-delay:-6s}

    /* Black hole theme global overrides */
    body[data-theme="blackhole"]{--bg:#000000;--surface:#000000;--panel:#0a0a0a;--border:#1a1a1a;--accent:#ff6a00;--accent2:#ffffff;--text:#ffffff;--muted:#555555;--bubble-mine:#000000;--bubble-mine-text:#ffffff;--bubble-other:#0a0a0a;--bubble-other-text:#ffffff}
    body[data-theme="blackhole"] header,body[data-theme="blackhole"] .chat-header{border-color:#1a1a1a}
    body[data-theme="blackhole"] .avatar,body[data-theme="blackhole"] .msg-avatar{background:radial-gradient(circle at 50% 50%,#000 0% 30%,#ff6a00 60%,#000 100%);box-shadow:0 0 10px rgba(255,106,0,.5)}
    body[data-theme="blackhole"] #app{position:relative;background:transparent}
    body[data-theme="blackhole"] #app::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 50% 100%,rgba(255,106,0,.08) 0%,transparent 55%)}
    body[data-theme="blackhole"] .messages{background:transparent}
    body[data-theme="blackhole"] .msg-bubble:not(.own){background:rgba(10,10,10,.82);backdrop-filter:blur(2px)}
    body[data-theme="blackhole"] .msg-bubble.own{box-shadow:0 0 12px rgba(255,106,0,.25)}
    body[data-theme="blackhole"] .btn-send{background:linear-gradient(135deg,#ff6a00,#000000);box-shadow:0 4px 16px rgba(255,106,0,.4)}

    /* ═══════════════════════════════
       AUTH SCREEN
    ═══════════════════════════════ */
    #auth{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
    #auth::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at center,transparent 22%,rgba(2,3,9,.82) 100%);pointer-events:none}
    #auth-ui{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;gap:20px;animation:slideUp .6s cubic-bezier(.16,1,.3,1) both}
    .auth-brand{font-size:36px;font-weight:900;letter-spacing:-1px;background:linear-gradient(130deg,#fff 0%,var(--accent) 28%,var(--accent2) 60%,var(--teal) 85%,#fff 100%);background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:authGrad 6s ease infinite;text-align:center}
    @keyframes authGrad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
    .auth-tag{font-size:11px;color:var(--muted);letter-spacing:5px;text-transform:uppercase;margin-top:5px;display:block;text-align:center}
    .auth-card{background:linear-gradient(145deg,rgba(8,12,26,.97),rgba(14,18,36,.94));border:1px solid rgba(124,109,250,.18);border-radius:28px;padding:30px 26px;width:358px;max-width:calc(100vw - 32px);display:flex;flex-direction:column;gap:16px;backdrop-filter:blur(28px);box-shadow:0 0 0 1px rgba(124,109,250,.07),0 28px 80px -16px rgba(0,0,0,.95),0 0 60px -20px rgba(124,109,250,.12),inset 0 1px 0 rgba(255,255,255,.07);animation:scaleIn .5s cubic-bezier(.16,1,.3,1) .1s both}
    .auth-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;border-radius:28px 28px 0 0;background:linear-gradient(90deg,transparent,rgba(124,109,250,.9),rgba(250,109,155,.7),rgba(45,212,191,.7),transparent);background-size:200% 100%;animation:authShimmer 4s linear infinite}
    @keyframes authShimmer{from{background-position:200% 0}to{background-position:-200% 0}}
    .auth-card{position:relative}
    .auth-tabs{display:flex;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:4px;gap:4px}
    .auth-tab{flex:1;padding:10px;border-radius:11px;font-size:13px;font-weight:700;color:var(--muted);transition:color .2s;text-align:center;position:relative;z-index:1}
    .auth-tab.active{color:var(--text)}
    .auth-tab.active::before{content:'';position:absolute;inset:0;border-radius:11px;z-index:-1;background:linear-gradient(135deg,rgba(124,109,250,.22),rgba(250,109,155,.12));border:1px solid rgba(124,109,250,.28);box-shadow:0 2px 14px rgba(124,109,250,.15),inset 0 1px 0 rgba(255,255,255,.09)}
    .auth-form{display:none;flex-direction:column;gap:14px}
    .auth-form.active{display:flex}
    .form-group{display:flex;flex-direction:column;gap:6px}
    .form-group label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
    .form-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
    .form-group input{padding:13px 14px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);border-radius:13px;font-size:14px;color:var(--text);transition:border-color .25s,background .25s,box-shadow .25s}
    .form-group input:focus{border-color:rgba(124,109,250,.55);background:rgba(124,109,250,.07);box-shadow:0 0 0 3px rgba(124,109,250,.12),0 0 24px rgba(124,109,250,.1)}
    .form-group input::placeholder{color:var(--muted)}
    .auth-btn{position:relative;overflow:hidden;padding:15px;border-radius:14px;font-size:15px;font-weight:800;color:#fff;letter-spacing:.5px;background:linear-gradient(135deg,#7c6dfa 0%,#a855f7 35%,#fa6d9b 70%,#7c6dfa 100%);background-size:260% 260%;animation:authBtnGrad 5s ease infinite;box-shadow:0 4px 22px rgba(124,109,250,.48),0 0 44px rgba(124,109,250,.14),inset 0 1px 0 rgba(255,255,255,.22);transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s}
    @keyframes authBtnGrad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
    .auth-btn::before{content:'';position:absolute;top:0;left:-110%;width:55%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);transition:left .55s ease}
    .auth-btn:hover::before{left:155%}
    .auth-btn:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 10px 36px rgba(124,109,250,.7),0 0 70px rgba(124,109,250,.22)}
    .auth-btn:active{transform:scale(.97)}
    .auth-btn:disabled{opacity:.6;pointer-events:none}
    .auth-err{font-size:12px;color:var(--red);text-align:center;min-height:18px;display:flex;align-items:center;justify-content:center;gap:5px}
    .auth-err:not(:empty){animation:shake .4s ease}
    .auth-status{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:14px;background:rgba(6,9,20,.88);border:1px solid rgba(124,109,250,.14);border-radius:99px;padding:7px 18px;backdrop-filter:blur(16px);font-size:11px;color:var(--muted);letter-spacing:1px}
    .auth-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2s ease-in-out infinite}

    /* ═══════════════════════════════
       APP LAYOUT
    ═══════════════════════════════ */
    #app{display:flex;flex-direction:column;height:100vh;height:calc(var(--app-vh,100vh));position:relative;z-index:1}
    header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;animation:slideDown .4s cubic-bezier(.16,1,.3,1) both}
    .hl{display:flex;align-items:center;gap:10px}
    .avatar{width:36px;height:36px;border-radius:11px;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;background:var(--panel);color:var(--text);flex-shrink:0;cursor:pointer;transition:transform .15s cubic-bezier(.34,1.56,.64,1);overflow:hidden}
    .avatar:hover{transform:scale(1.06)}
    .avatar img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
    .hname{font-size:14px;font-weight:600;cursor:pointer}
    .hname:hover{color:var(--accent)}
    .hstatus{font-size:11px;color:var(--muted)}
    .hr{display:flex;gap:6px;align-items:center}
    .icon-btn{width:34px;height:34px;border-radius:10px;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:15px;transition:background var(--ease),transform .15s cubic-bezier(.34,1.56,.64,1)}
    .icon-btn:hover{background:var(--border);transform:scale(1.08)}
    .icon-btn:active{transform:scale(.92)}

    /* ═══════════════════════════════
       MESSAGES
    ═══════════════════════════════ */
    #messages{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:3px}
    .msg-group{display:flex;gap:6px;align-items:flex-end;animation:slideUp .35s cubic-bezier(.34,1.56,.64,1)}
    .msg-group.own{flex-direction:row-reverse}
    .msg-group.gtop{margin-top:10px}
    .msg-avatar{width:26px;height:26px;border-radius:8px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--panel);color:var(--text);animation:avPop .3s cubic-bezier(.34,1.56,.64,1);cursor:pointer;overflow:hidden}
    .msg-avatar img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
    .msg-ph{width:26px;flex-shrink:0}
    .msg-content{display:flex;flex-direction:column;max-width:70%}
    .msg-group.own .msg-content{align-items:flex-end}
    .msg-author{font-size:10px;color:var(--muted);margin-bottom:3px;padding:0 3px}
    .msg-bubble{padding:9px 13px;border-radius:var(--radius);font-size:14px;line-height:1.6;word-break:break-word;transition:transform .15s ease,box-shadow .15s ease}
    .msg-bubble:active{transform:scale(.985)}
    .msg-bubble.own{background:var(--bubble-mine);color:var(--bubble-mine-text);border-bottom-left-radius:5px}
    .msg-bubble:not(.own){background:var(--bubble-other);color:var(--bubble-other-text);border:1px solid var(--border);border-bottom-right-radius:5px}
    .msg-bubble img{max-width:260px;max-height:260px;border-radius:10px;display:block;cursor:pointer;margin-top:4px}
    .msg-bubble audio{max-width:220px;width:100%;margin-top:4px;border-radius:8px}
    .msg-bubble .file-link{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(255,255,255,.06);border-radius:8px;margin-top:4px;text-decoration:none;color:var(--text);font-size:12px;transition:background var(--ease)}
    .msg-bubble .file-link:hover{background:rgba(255,255,255,.12)}
    .msg-meta{font-size:10px;color:var(--muted);margin-top:4px;padding:0 3px}
    .msg-group.own .msg-meta{text-align:left}
    .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:.4}
    .empty-icon{font-size:44px}
    .empty-txt{font-size:13px;color:var(--muted)}

    /* ═══════════════════════════════
       INPUT BAR
    ═══════════════════════════════ */
    #typing{min-height:20px;padding:2px 14px 4px;font-size:12px;color:var(--muted)}
    #input-bar{padding:10px 14px 14px;background:var(--surface);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;flex-shrink:0}
    .irow{display:flex;gap:8px;align-items:flex-end}
    #msg-input{flex:1;padding:10px 14px;background:var(--panel);border:1.5px solid var(--border);border-radius:14px;font-size:14px;resize:none;max-height:110px;line-height:1.55;transition:border-color var(--ease)}
    #msg-input:focus{border-color:var(--accent)}
    #msg-input::placeholder{color:var(--muted)}
    #send-btn{width:42px;height:42px;border-radius:13px;flex-shrink:0;background:var(--accent);color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow var(--ease);box-shadow:0 3px 12px rgba(124,109,250,.3)}
    #send-btn:hover{transform:scale(1.08) rotate(-8deg)}
    #send-btn:active{transform:scale(.9) rotate(0deg)}
    #send-btn.sent{animation:sendPop .3s cubic-bezier(.34,1.56,.64,1)}
    .attach-btn{width:42px;height:42px;border-radius:13px;flex-shrink:0;background:var(--panel);border:1.5px solid var(--border);color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s cubic-bezier(.34,1.56,.64,1);cursor:pointer}
    .attach-btn:hover{background:var(--border);transform:scale(1.08)}
    .camera-btn{width:42px;height:42px;border-radius:13px;flex-shrink:0;background:var(--panel);border:1.5px solid var(--border);color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s cubic-bezier(.34,1.56,.64,1);cursor:pointer}
    .camera-btn:hover{background:var(--border);transform:scale(1.08)}

    /* MEDIA PREVIEW */
    .media-preview{display:none;padding:6px 0 2px;position:relative}
    .media-preview img,.media-preview video{max-width:180px;max-height:120px;border-radius:10px;display:block}
    .media-preview .cancel-media{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;line-height:1}

    /* ═══════════════════════════════
       PROFILE MODAL
    ═══════════════════════════════ */
    #profile-overlay{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:210;display:none;align-items:center;justify-content:center;padding:20px;transition:background .25s ease}
    #profile-overlay.show{display:flex;background:rgba(0,0,0,.55)}
    #profile-card{background:var(--surface);border-radius:24px;width:100%;max-width:360px;max-height:88vh;overflow-y:auto;transform:scale(.9) translateY(20px);opacity:0;transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .25s ease}
    #profile-overlay.show #profile-card{transform:scale(1) translateY(0);opacity:1}
    .pf-header{position:relative;height:90px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:24px 24px 0 0;flex-shrink:0}
    .pf-close{position:absolute;top:10px;left:10px;width:32px;height:32px;border-radius:10px;background:rgba(0,0,0,.25);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;transition:background var(--ease)}
    .pf-close:hover{background:rgba(0,0,0,.4)}
    .pf-avatar-wrap{position:relative;width:84px;height:84px;border-radius:24px;margin:-42px auto 0;border:4px solid var(--surface);background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:38px;overflow:hidden}
    .pf-avatar-wrap img{width:100%;height:100%;object-fit:cover}
    .pf-upload-btn{position:absolute;bottom:-2px;left:-2px;width:28px;height:28px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;border:2px solid var(--surface);transition:transform .15s cubic-bezier(.34,1.56,.64,1);cursor:pointer}
    .pf-upload-btn:hover{transform:scale(1.1)}
    .pf-upload-btn input{display:none}
    .pf-body{padding:14px 20px 22px;display:flex;flex-direction:column;align-items:center;gap:4px}
    .pf-name{font-size:18px;font-weight:700;display:flex;align-items:center;gap:6px}
    .pf-email{font-size:12px;color:var(--muted)}
    .pf-role-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;margin-top:6px}
    .pf-role-badge.owner{background:rgba(124,109,250,.15);color:var(--accent)}
    .pf-role-badge.admin{background:rgba(250,109,155,.15);color:var(--accent2)}
    .pf-role-badge.user{background:var(--panel);color:var(--muted)}
    .pf-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:16px}
    .pf-stat{background:var(--panel);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;align-items:center}
    .pf-stat-val{font-size:18px;font-weight:700}
    .pf-stat-lbl{font-size:11px;color:var(--muted)}

    /* ═══════════════════════════════
       THEME PANEL
    ═══════════════════════════════ */
    #theme-overlay{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:200;display:none;align-items:flex-end;justify-content:center;transition:background .25s ease}
    #theme-overlay.show{display:flex;background:rgba(0,0,0,.55)}
    #theme-panel{background:var(--surface);border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;transform:translateY(100%) scale(.96);opacity:0;transition:transform .42s cubic-bezier(.34,1.1,.4,1),opacity .3s ease}
    #theme-overlay.show #theme-panel{transform:translateY(0) scale(1);opacity:1}
    .tp-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
    .tp-title{font-size:16px;font-weight:700}
    .tp-body{overflow-y:auto;padding:14px 18px 24px;display:flex;flex-direction:column;gap:18px}
    .tp-section-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
    .tp-presets{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
    .tp-presets::-webkit-scrollbar{height:0}
    .preset-chip{flex-shrink:0;width:68px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:16px;border:1.5px solid var(--border);background:var(--panel);transition:all var(--ease);cursor:pointer}
    .preset-chip:hover{transform:scale(1.06);border-color:var(--accent)}
    .preset-chip.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(124,109,250,.25)}
    .preset-swatch{width:44px;height:44px;border-radius:12px;display:flex;overflow:hidden;position:relative}
    .preset-swatch span{flex:1;height:100%}
    .preset-label{font-size:10px;color:var(--muted);text-align:center}
    /* Black hole swatch */
    .preset-chip.preset-blackhole .preset-swatch{background:radial-gradient(circle at 50% 50%,#000 0% 35%,#ff6a00 55%,#000 80%)}
    .preset-blackhole-core{position:absolute;inset:0;z-index:2;border-radius:12px;overflow:hidden}
    .preset-blackhole-core::before{content:'';position:absolute;inset:0;background:conic-gradient(from 0deg,transparent 0deg,#ff6a00 60deg,transparent 120deg,#fff 180deg,transparent 240deg,#ff6a00 300deg,transparent 360deg);animation:blackholeSpin 2.5s linear infinite;opacity:.85}
    .preset-blackhole-core::after{content:'';position:absolute;inset:30%;border-radius:50%;background:#000;box-shadow:0 0 10px 3px rgba(255,106,0,.5)}
    .preset-chip.preset-blackhole:not(.locked):hover .preset-swatch{box-shadow:0 0 18px rgba(255,106,0,.7)}
    .preset-chip.preset-blackhole .preset-label{color:#ff6a00;font-weight:800;animation:blackholePulse 1.6s ease-in-out infinite}
    .tp-actions{display:flex;gap:8px;padding-top:6px}
    .tp-action-btn{flex:1;padding:11px;border-radius:12px;font-size:13px;font-weight:600;background:var(--panel);border:1px solid var(--border);transition:all var(--ease)}
    .tp-action-btn:hover{background:var(--border)}
    .tp-action-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none}

    /* ═══════════════════════════════
       TOAST
    ═══════════════════════════════ */
    #toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px) scale(.9);background:var(--panel);border:1px solid var(--border);padding:9px 18px;border-radius:99px;font-size:13px;opacity:0;transition:all .35s cubic-bezier(.34,1.56,.64,1);pointer-events:none;z-index:99;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.25)}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}

    /* ═══════════════════════════════
       MOBILE
    ═══════════════════════════════ */
    @media(max-width:768px){
      .msg-content{max-width:82%}
      input,textarea{font-size:16px!important}
    }
    @media(max-height:680px){
      #auth-ui{gap:13px}
      .auth-brand{font-size:28px}
      .auth-card{padding:20px 16px;gap:13px}
    }
  </style>
</head>

<div id="app">
  <!-- AUTH -->
  <div id="auth">
    <div id="auth-ui">
      <div>
        <div class="auth-brand">GapChat</div>
        <span class="auth-tag">پیام‌رسان نسل بعدی</span>
      </div>
      <div class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">ورود</button>
          <button class="auth-tab" data-tab="register">ثبت‌نام</button>
        </div>
        <form id="loginForm" class="auth-form active">
          <div class="form-group">
            <label><span class="form-dot" style="background:var(--accent);box-shadow:0 0 8px var(--accent)"></span> ایمیل</label>

          <div class="form-group">
            <label><span class="form-dot" style="background:var(--teal);box-shadow:0 0 8px var(--teal)"></span> رمز عبور</label>

        </form>
        <form id="registerForm" class="auth-form">
          <div class="form-group">
            <label><span class="form-dot" style="background:var(--accent);box-shadow:0 0 8px var(--accent)"></span> اسم نمایشی</label>

          </div>
          <div class="form-group">
            <label><span class="form-dot" style="background:var(--accent2);box-shadow:0 0 8px var(--accent2)"></span> ایمیل</label>
            <input type="email" id="regEmail" placeholder="example@email.com" required>
          </div>
          <div class="form-group">
            <label><span class="form-dot" style="background:var(--teal);box-shadow:0 0 8px var(--teal)"></span> رمز عبور</label>
            <input type="password" id="regPass" placeholder="حداقل ۶ کاراکتر" required minlength="6">

          <input type="file" id="media-input" accept="image/*,video/*" style="display:none"/>

        <label class="camera-btn" title="دوربین" style="cursor:pointer">
          <i class="fas fa-camera"></i>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ═══════════════ CONFIG ═══════════════
  const SB_URL='https://dvhjswspljxbjxngetdc.supabase.co';
  const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2aGpzd3NwbGp4Ymp4bmdldGRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4OTA5NDAsImV4cCI6MjEwMDQ2Njk0MH0.HRU4N_JM7mDBQJ2t9t_AfSk8zE-dPz7BecRpop0uxww';
  const db=supabase.createClient(SB_URL,SB_KEY);

  // ═══════════════ STATE ═══════════════
  let me=null,myProfile=null;
  const $=id=>document.getElementById(id);
  let pendingMediaFile=null,pendingMediaIsVideo=false;
  let lastMsgId=0,pollTimer=null;

  // ═══════════════ THEME ═══════════════
  const THEMES={
    'پیش‌默认':{bg:'#0b0d12',surface:'#13161f',panel:'#1a1e2a',border:'#252a3a',accent:'#7c6dfa',accent2:'#fa6d9b',text:'#e2e5f0',muted:'#6b7094',bMine:'#7c6dfa',bMineT:'#ffffff',bOther:'#13161f',bOtherT:'#e2e5f0',radius:'16px'},
    'سیاه‌چاله':{bg:'#000000',surface:'#000000',panel:'#0a0a0a',border:'#1a1a1a',accent:'#ff6a00',accent2:'#ffffff',text:'#ffffff',muted:'#555555',bMine:'#000000',bMineT:'#ffffff',bOther:'#0a0a0a',bOtherT:'#ffffff',radius:'16px'},
    'اقیانوسی':{bg:'#071421',surface:'#0e2235',panel:'#163348',border:'#1f4258',accent:'#22d3ee',accent2:'#3b82f6',text:'#e6f6fb',muted:'#7aa3b8',bMine:'#22d3ee',bMineT:'#04222b',bOther:'#0e2235',bOtherT:'#e6f6fb',radius:'16px'},
    'بنفش شب':{bg:'#0e0a1a',surface:'#181228',panel:'#241b3a',border:'#352a52',accent:'#a78bfa',accent2:'#f472b6',text:'#ede9fe',muted:'#9183b8',bMine:'#a78bfa',bMineT:'#1a1330',bOther:'#181228',bOtherT:'#ede9fe',radius:'18px'},
    'روشن':{bg:'#f2f4fb',surface:'#ffffff',panel:'#e8ebf7',border:'#d0d5ea',accent:'#7c6dfa',accent2:'#fa6d9b',text:'#1a1d2e',muted:'#6b6f8a',bMine:'#7c6dfa',bMineT:'#ffffff',bOther:'#ffffff',bOtherT:'#1a1d2e',radius:'16px'},
    'کهکشان':{bg:'#05030f',surface:'#0c0a22',panel:'#15123a',border:'#2a235c',accent:'#a855f7',accent2:'#22d3ee',text:'#f0eaff',muted:'#8b80c4',bMine:'#a855f7',bMineT:'#ffffff',bOther:'#0c0a22',bOtherT:'#f0eaff',radius:'18px'},
  };
  let currentTheme=localStorage.getItem('gapchat_theme')||'پیش‌默认';

  function applyTheme(name){
    currentTheme=name;
    const t=THEMES[name]; if(!t) return;
    const r=document.documentElement;
    r.style.setProperty('--bg',t.bg);r.style.setProperty('--surface',t.surface);
    r.style.setProperty('--panel',t.panel);r.style.setProperty('--border',t.border);
    r.style.setProperty('--accent',t.accent);r.style.setProperty('--accent2',t.accent2);
    r.style.setProperty('--text',t.text);r.style.setProperty('--muted',t.muted);
    r.style.setProperty('--bubble-mine',t.bMine);r.style.setProperty('--bubble-mine-text',t.bMineT);
    r.style.setProperty('--bubble-other',t.bOther);r.style.setProperty('--bubble-other-text',t.bOtherT);
    r.style.setProperty('--radius',t.radius);
    document.body.setAttribute('data-theme',name==='سیاه‌چاله'?'blackhole':'default');
    localStorage.setItem('gapchat_theme',name);
  }

  function renderThemePresets(){
    const el=$('tp-presets'); el.innerHTML='';
    Object.keys(THEMES).forEach(name=>{
      const t=THEMES[name];
      const chip=document.createElement('button');
      chip.className='preset-chip'+(currentTheme===name?' active':'')+(name==='سیاه‌چاله'?' preset-blackhole':'');
      chip.onclick=()=>{applyTheme(name);renderThemePresets()};
      const extra=name==='سیاه‌چاله'?'<div class="preset-blackhole-core"></div>':'';
      chip.innerHTML=`<div class="preset-swatch">${extra}${name==='سیاه‌چاله'?'':`<span style="background:${t.bg}"></span><span style="background:${t.accent}"></span><span style="background:${t.accent2}"></span>`}</div><div class="preset-label">${name}</div>`;
      el.appendChild(chip);
    });
  }

  window.openThemePanel=()=>{renderThemePresets();$('theme-overlay').style.display='flex';requestAnimationFrame(()=>requestAnimationFrame(()=>$('theme-overlay').classList.add('show')))};
  window.closeThemePanel=()=>{$('theme-overlay').classList.remove('show');setTimeout(()=>{if(!$('theme-overlay').classList.contains('show'))$('theme-overlay').style.display='none'},420)};
  window.resetTheme=()=>{applyTheme('پیش‌默认');renderThemePresets();toast('تم بازنشانی شد')};

  // ═══════════════ AUTH ═══════════════
  document.querySelectorAll('.auth-tab').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.auth-tab').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    const t=b.dataset.tab;
    $('loginForm').classList.toggle('active',t==='login');
    $('registerForm').classList.toggle('active',t==='register');
    $('authErr').textContent='';$('authErr2').textContent='';
  }));

  $('loginForm').onsubmit=async e=>{
    e.preventDefault();
    const email=$('loginEmail').value.trim(),pass=$('loginPass').value;
    if(!email||!pass){$('authErr').textContent='ایمیل و رمز رو پر کن';return}
    $('authErr').textContent='';
    const btn=$('loginForm').querySelector('.auth-btn');btn.disabled=true;btn.innerHTML='<span style="display:inline-block;animation:pulse 1s infinite">⏳</span>';
    const{error}=await db.auth.signInWithPassword({email,password:pass});
    if(error){$('authErr').textContent=error.message.includes('Invalid')?'ایمیل یا پسورد اشتباهه':error.message;btn.disabled=false;btn.textContent='ورود به GapChat ←';return}
    await loadSession();
  };

  $('registerForm').onsubmit=async e=>{
    e.preventDefault();
    const name=$('regName').value.trim(),email=$('regEmail').value.trim(),pass=$('regPass').value;
    if(!name||!email||!pass){$('authErr2').textContent='همه فیلدها رو پر کن';return}
    $('authErr2').textContent='';
    const btn=$('registerForm').querySelector('.auth-btn');btn.disabled=true;btn.innerHTML='<span style="display:inline-block;animation:pulse 1s infinite">⏳</span>';
    const{data,error}=await db.auth.signUp({email,password:pass,options:{data:{display_name:name}}});
    if(error){$('authErr2').textContent=error.message.includes('already')?'این ایمیل قبلاً ثبت شده':error.message;btn.disabled=false;btn.textContent='ساخت حساب ←';return}
    // Auto create profile
    if(data.user){
      const{count}=await db.from('profiles').select('*',{count:'exact',head:true});
      await db.from('profiles').insert({id:data.user.id,username:name,display_name:name,role:count===0?'owner':'user'});
    }
    $('authErr2').textContent='';toast('ثبت‌نام انجام شد! حالا وارد شو ✓');
    document.querySelectorAll('.auth-tab')[0].click();
    $('loginEmail').value=email;$('loginPass').value=pass;
    btn.disabled=false;btn.textContent='ساخت حساب ←';
  };

  async function loadSession(){
    const{data:{user}}=await db.auth.getUser();
    if(!user) return;
    await new Promise(r=>setTimeout(r,200));
    let{data:profile}=await db.from('profiles').select('*').eq('id',user.id).single();
    if(!profile){
      const{count}=await db.from('profiles').select('*',{count:'exact',head:true});
      const un=user.user_metadata?.display_name||user.email.split('@')[0];
      await db.from('profiles').insert({id:user.id,username:un,display_name:un,role:count===0?'owner':'user'});
      ({data:profile}=await db.from('profiles').select('*').eq('id',user.id).single());
    }
    if(profile){me=user;myProfile=profile;enterApp()}
  }

  window.signOut=async()=>{
    if(!confirm('از حساب خارج بشی؟'))return;
    await db.auth.signOut();me=null;myProfile=null;
    $('auth').style.display='flex';$('header').style.display='none';$('chat').style.display='none';
    if(pollTimer)clearInterval(pollTimer);
  };

  // ═══════════════ APP ═══════════════
  function enterApp(){
    $('auth').style.display='none';
    $('header').style.display='flex';
    $('chat').style.display='flex';
    renderAvatar($('hav'),myProfile);
    $('hname').textContent=myProfile.display_name||myProfile.username+(myProfile.role==='owner'?' 👑':'');
    loadMessages();
    startPolling();
  }

  function renderAvatar(el,profile){
    if(profile?.avatar_url){el.innerHTML=`<img src="${esc(profile.avatar_url)}" alt=""/>`}
    else{el.textContent=(profile?.display_name||profile?.username||'?').charAt(0).toUpperCase()}
  }

  // ═══════════════ MESSAGES ═══════════════
  async function loadMessages(){
    const{data}=await db.from('messages').select('*, profiles:user_id (id,username,display_name,role,avatar_url)').order('created_at').limit(100);
    $('messages').innerHTML='';
    if(!data||!data.length){return}
    $('empty-state')?.remove();
    data.forEach(m=>{addMsg(m);lastMsgId=m.created_at});
    scrollBottom();
  }

  function startPolling(){
    if(pollTimer)clearInterval(pollTimer);
    pollTimer=setInterval(async()=>{
      if(!me) return;
      const{data}=await db.from('messages').select('*, profiles:user_id (id,username,display_name,role,avatar_url)').gt('created_at',lastMsgId||'1970-01-01').order('created_at');
      if(data&&data.length){
        $('empty-state')?.remove();
        data.forEach(m=>{addMsg(m);lastMsgId=m.created_at});
        scrollBottom();
      }
    },1500);
  }

  function addMsg(m){
    const c=$('messages');
    const d=document.createElement('div');
    const own=m.user_id===me?.id;
    const u=m.profiles;
    const time=new Date(m.created_at).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
    let content='';

    if(m.type==='text') content=`${esc(m.content)}`;
    else if(m.type==='image') content=`<img src="${m.file_url}" loading="lazy" onclick="window.open('${m.file_url}','_blank')">`;
    else if(m.type==='video') content=`<video src="${m.file_url}" controls style="max-width:260px;max-height:260px;border-radius:10px"></video>`;
    else if(m.type==='voice') content=`<audio controls src="${m.file_url}" style="max-width:220px"></audio>`;
    else if(m.type==='file') content=`<a href="${m.file_url}" class="file-link" target="_blank"><i class="fas fa-file"></i> ${esc(m.file_name||'فایل')}</a>`;

    d.className=`msg-group ${own?'own':''}`;
    d.innerHTML=`<div class="msg-avatar" onclick="openProfile('${esc(u?.display_name||'?')}')" style="background:${own?'var(--accent)':'linear-gradient(135deg,var(--green),#16a34a)'}">${renderAvatarContent(u)}</div><div class="msg-content"><div class="msg-author">${esc(u?.display_name||'ناشناس')}</div><div class="msg-bubble${own?' own':''}">${content}</div><div class="msg-meta">${time}</div></div>`;
    c.appendChild(d);
  }

  function renderAvatarContent(u){
    if(u?.avatar_url) return `<img src="${esc(u.avatar_url)}" alt=""/>`;
    return (u?.display_name||'?').charAt(0).toUpperCase();
  }

  function scrollBottom(){const c=$('messages');requestAnimationFrame(()=>{c.scrollTop=c.scrollHeight})}

  window.sendMsg=async function(){
    const inp=$('msg-input');
    const text=inp.value.trim();
    if((!text&&!pendingMediaFile)||!me) return;

    if(pendingMediaFile){
      await sendMediaMessage(inp,text);
      return;
    }

    inp.value='';inp.style.height='';
    const sb=$('send-btn');sb.classList.remove('sent');void sb.offsetWidth;sb.classList.add('sent');
    await db.from('messages').insert({user_id:me.id,type:'text',content:text});
  };

  // ═══════════════ MEDIA UPLOAD ═══════════════
  $('media-input').addEventListener('change',function(){
    const file=this.files[0];if(!file) return;
    if(file.size>50*1024*1024){toast('حجم فایل باید کمتر از ۵۰ مگابایت باشه');this.value='';return}
    pendingMediaFile=file;
    pendingMediaIsVideo=file.type.startsWith('video/');
    const url=URL.createObjectURL(file);
    if(pendingMediaIsVideo){$('media-preview-vid').src=url;$('media-preview-vid').style.display='block';$('media-preview-img').style.display='none'}
    else{$('media-preview-img').src=url;$('media-preview-img').style.display='block';$('media-preview-vid').style.display='none'}
    $('media-preview').style.display='block';this.value='';
  });

  $('camera-input').addEventListener('change',function(){
    const file=this.files[0];if(!file) return;
    pendingMediaFile=file;pendingMediaIsVideo=false;
    $('media-preview-img').src=URL.createObjectURL(file);$('media-preview-img').style.display='block';$('media-preview-vid').style.display='none';
    $('media-preview').style.display='block';this.value='';
  });

  window.cancelMedia=()=>{pendingMediaFile=null;$('media-preview').style.display='none';$('media-preview-img').src='';$('media-preview-vid').src=''};

  async function sendMediaMessage(inp,caption){
    const file=pendingMediaFile;const isVideo=pendingMediaIsVideo;
    cancelMedia();inp.value='';inp.style.height='';
    const ext=(file.name.split('.').pop()||(isVideo?'mp4':'jpg')).toLowerCase().replace(/[^a-z0-9]/g,'');
    const path=`${Date.now()}.${ext||'jpg'}`;
    const bucket=isVideo?'chat-videos':'chat-images';
    try{
      toast('⏳ در حال آپلود…');
      const{error:upErr}=await db.storage.from(bucket).upload(path,file,{upsert:true});
      if(upErr) throw upErr;
      const{data:urlData}=db.storage.from(bucket).getPublicUrl(path);
      const publicUrl=urlData.publicUrl;
      const type=isVideo?'video':file.type.startsWith('image/')?'image':file.type.startsWith('audio/')?'voice':'file';
      await db.from('messages').insert({user_id:me.id,type,content:caption||file.name,file_url:publicUrl,file_name:file.name,file_size:file.size});
      toast('✅ ارسال شد');
    }catch(err){toast('❌ آپلود ناموفق: '+err.message)}
  }

  // ═══════════════ PROFILE ═══════════════
  window.openProfile=async function(name){
    $('profile-overlay').classList.add('show');
    $('profile-body').innerHTML='<div style="padding:30px;text-align:center;color:var(--muted);font-size:13px">در حال بارگذاری…</div>';
    const{data}=await db.from('profiles').select('*').eq('display_name',name).single();
    if(!data){$('profile-body').innerHTML='<div style="padding:30px;text-align:center;color:var(--muted)">کاربر پیدا نشد</div>';return}
    const{count:msgCount}=await db.from('messages').select('*',{count:'exact',head:true}).eq('user_id',data.id);
    const roleName=data.role==='owner'?'مالک':data.role==='admin'?'ادمین':'کاربر';
    const avatarHtml=data.avatar_url?`<img src="${esc(data.avatar_url)}" alt=""/>`:(data.display_name||'?').charAt(0).toUpperCase();
    $('profile-body').innerHTML=`
      <div class="pf-avatar-wrap">${avatarHtml}</div>
      <div class="pf-name">${esc(data.display_name||data.username)}</div>
      <div class="pf-email">${esc(data.username)}</div>
      <span class="pf-role-badge ${data.role}">${roleName}</span>
      <div class="pf-stats">
        <div class="pf-stat"><div class="pf-stat-val">${msgCount||0}</div><div class="pf-stat-lbl">پیام</div></div>
        <div class="pf-stat"><div class="pf-stat-val">${new Date(data.created_at).toLocaleDateString('fa-IR')}</div><div class="pf-stat-lbl">عضویت</div></div>
      </div>`;
  };

  window.openMyProfile=()=>{if(myProfile)openProfile(myProfile.display_name||myProfile.username)};
  window.closeProfile=()=>$('profile-overlay').classList.remove('show');

  // ═══════════════ HELPERS ═══════════════
  function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}
  function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500)}

  // ═══════════════ INPUT ═══════════════
  $('msg-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}});
  $('msg-input').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,110)+'px'});

  // ═══════════════ INIT ═══════════════
  applyTheme(currentTheme);
  loadSession();
</script>
</body>
</html>
