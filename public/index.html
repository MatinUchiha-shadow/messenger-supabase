<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GapChat</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#0b0d12;--surface:#13161f;--panel:#1a1e2a;--border:#252a3a;--accent:#7c6dfa;--accent2:#fa6d9b;--teal:#2dd4bf;--green:#22c55e;--text:#e2e5f0;--muted:#6b7094;--red:#e5334a;--bubble-mine:#7c6dfa;--bubble-mine-text:#fff;--bubble-other:#13161f;--bubble-other-text:#e2e5f0;--font:'Vazirmatn',system-ui,sans-serif;--ease:.18s cubic-bezier(.4,0,.2,1);--radius:16px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text)}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
input,textarea{font-family:inherit;outline:none;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@keyframes sendPop{0%{transform:scale(.85)}50%{transform:scale(1.15) rotate(-12deg)}100%{transform:scale(1)}}
@keyframes typing{0%,80%,100%{transform:scale(.5);opacity:.3}40%{transform:scale(1);opacity:1}}
@keyframes blackholeSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes blackholePulse{0%,100%{text-shadow:0 0 4px rgba(255,106,0,.4)}50%{text-shadow:0 0 12px rgba(255,106,0,.9)}}
@keyframes bhAmbientPulse{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes bhOrbit{from{offset-distance:0%}to{offset-distance:100%}}

/* BLACK HOLE */
#bh-vis{position:absolute;top:50%;left:50%;width:min(110vmin,800px);height:min(110vmin,800px);transform:translate(-50%,-50%);z-index:0;pointer-events:none;display:none}
body[data-theme="blackhole"] #bh-vis{display:block}
#bh-vis svg{position:absolute;inset:0;width:100%;height:100%}
.bh-amb{position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(circle,rgba(255,110,30,.1),transparent 68%);animation:bhAmbientPulse 8s ease-in-out infinite}
.bh-disk{animation:bhAmbientPulse 5s ease-in-out infinite;transform-origin:200px 200px}
.bh-hot ellipse{offset-path:path("M 5 200 A 195 46 0 1 1 395 200 A 195 46 0 1 1 5 200");animation:bhOrbit 12s linear infinite;mix-blend-mode:screen}
.bh-hot ellipse:nth-child(2){animation-delay:-6s}
body[data-theme="blackhole"]{--bg:#000;--surface:rgba(0,0,0,.88);--panel:rgba(10,10,10,.92);--border:rgba(255,255,255,.06);--accent:#ff6a00;--accent2:#ffa500;--text:#fff;--muted:#555;--bubble-mine:#1a1a1a;--bubble-other:rgba(15,15,15,.9);--bubble-other-text:#fff}
body[data-theme="blackhole"] .sidebar,body[data-theme="blackhole"] header,body[data-theme="blackhole"] .chat-header{border-color:rgba(255,255,255,.04)}
body[data-theme="blackhole"] .msg-av{background:radial-gradient(circle,#000 0% 30%,#ff6a00 60%,#000 100%)!important;box-shadow:0 0 8px rgba(255,106,0,.4)}
body[data-theme="blackhole"] #app{background:transparent}
body[data-theme="blackhole"] .main{background:transparent}
body[data-theme="blackhole"] header,body[data-theme="blackhole"] #input-bar{background:rgba(0,0,0,.75);backdrop-filter:blur(12px)}
body[data-theme="blackhole"] #messages{background:transparent}
body[data-theme="blackhole"] .msg-bubble.mine{box-shadow:0 0 10px rgba(255,106,0,.2)}

/* AUTH */
#auth{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#auth::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 22%,rgba(2,3,9,.82));pointer-events:none}
.auth-ui{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;gap:20px;animation:slideUp .6s cubic-bezier(.16,1,.3,1) both}
.auth-brand{font-size:34px;font-weight:900;background:linear-gradient(130deg,#fff,var(--accent),var(--accent2),var(--teal),#fff);background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:authGrad 6s ease infinite}
@keyframes authGrad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.auth-tag{font-size:11px;color:var(--muted);letter-spacing:4px;text-transform:uppercase}
.auth-card{position:relative;background:linear-gradient(145deg,rgba(8,12,26,.97),rgba(14,18,36,.94));border:1px solid rgba(124,109,250,.18);border-radius:24px;padding:28px 24px;width:340px;max-width:calc(100vw - 32px);display:flex;flex-direction:column;gap:14px;backdrop-filter:blur(28px);box-shadow:0 28px 80px -16px rgba(0,0,0,.95),0 0 60px -20px rgba(124,109,250,.12);animation:scaleIn .5s cubic-bezier(.16,1,.3,1) .1s both}
.auth-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;border-radius:24px 24px 0 0;background:linear-gradient(90deg,transparent,rgba(124,109,250,.9),rgba(250,109,155,.7),rgba(45,212,191,.7),transparent);background-size:200% 100%;animation:shimmer 4s linear infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.auth-tabs{display:flex;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:3px;gap:3px}
.auth-tab{flex:1;padding:9px;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted);transition:color .2s;text-align:center;position:relative;z-index:1}
.auth-tab.active{color:var(--text)}
.auth-tab.active::before{content:'';position:absolute;inset:0;border-radius:10px;z-index:-1;background:linear-gradient(135deg,rgba(124,109,250,.22),rgba(250,109,155,.12));border:1px solid rgba(124,109,250,.28);box-shadow:0 2px 14px rgba(124,109,250,.15)}
.auth-form{display:none;flex-direction:column;gap:12px}
.auth-form.active{display:flex}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:1px}
.fg input{padding:12px 14px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);border-radius:12px;font-size:14px;color:var(--text);transition:border-color .25s}
.fg input:focus{border-color:rgba(124,109,250,.55)}
.fg input::placeholder{color:var(--muted)}
.auth-btn{padding:13px;border-radius:12px;font-size:14px;font-weight:800;color:#fff;background:linear-gradient(135deg,#7c6dfa,#a855f7 50%,#fa6d9b);background-size:200% 200%;animation:authGrad 4s ease infinite;transition:transform .2s,box-shadow .2s}
.auth-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(124,109,250,.5)}
.auth-btn:active{transform:scale(.98)}
.auth-btn:disabled{opacity:.5;pointer-events:none}
.auth-err{font-size:12px;color:var(--red);text-align:center;min-height:16px}
.auth-err:not(:empty){animation:shake .3s}
.auth-status{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(6,9,20,.88);border:1px solid rgba(124,109,250,.14);border-radius:99px;padding:6px 16px;font-size:11px;color:var(--muted)}
.auth-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}

/* APP */
#app{display:none;height:100vh;height:100dvh;width:100vw;position:relative;z-index:2}
#app.show{display:flex}
#app::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0}

/* SIDEBAR */
.sidebar{width:260px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;z-index:60;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.sb-head{padding:12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:11px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;background:var(--panel);color:var(--text);flex-shrink:0;cursor:pointer;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.sb-info{flex:1;min-width:0}
.sb-name{font:600 13px inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-role{font-size:10px;padding:2px 8px;border-radius:6px;display:inline-block;margin-top:2px}
.sb-role.owner{background:rgba(124,109,250,.15);color:var(--accent)}
.sb-role.admin{background:rgba(250,109,155,.15);color:var(--accent2)}
.sb-role.user{background:var(--panel);color:var(--muted)}
.sb-body{flex:1;overflow-y:auto;padding:8px}
.sb-section{margin-bottom:12px}
.sb-sec-head{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;margin-bottom:4px}
.sb-sec-title{font:700 10px inherit;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.btn-add{width:20px;height:20px;border:none;background:transparent;color:var(--muted);border-radius:6px;cursor:pointer;font-size:11px;display:none;align-items:center;justify-content:center;transition:all .2s}
.btn-add.show{display:flex}
.btn-add:hover{background:var(--accent);color:#fff}
.room-item,.dm-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;cursor:pointer;transition:all .15s;color:var(--muted);font:500 13px inherit}
.room-item:hover,.dm-item:hover{background:var(--panel);color:var(--text)}
.room-item.active{background:rgba(124,109,250,.12);color:var(--accent)}
.room-item i{width:16px;text-align:center;font-size:12px;opacity:.7}
.room-item.active i{opacity:1}
.room-item span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-item .dm-av{width:32px;height:32px;border-radius:8px;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;overflow:hidden}
.dm-item .dm-av img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.online-item{display:flex;align-items:center;gap:8px;padding:4px 8px;font-size:12px;color:var(--muted)}
.online-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 6px var(--green)}
.sb-foot{padding:8px;border-top:1px solid var(--border)}
.btn-logout{width:100%;padding:9px;border:none;border-radius:8px;background:rgba(229,51,74,.1);color:var(--red);font:500 12px inherit;cursor:pointer;transition:all .2s}
.btn-logout:hover{background:var(--red);color:#fff}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;background:var(--bg);min-width:0;position:relative;z-index:1;overflow:hidden;min-height:0}
.chat-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--surface);flex-shrink:0}
.chat-title{display:flex;align-items:center;gap:8px;min-width:0}
.chat-title h2{font:600 14px inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-badge{font-size:10px;padding:2px 8px;border-radius:6px;background:var(--panel);color:var(--muted)}
.chat-badge.voice{background:rgba(34,197,94,.12);color:var(--green)}
.chat-actions{display:flex;gap:4px;align-items:center}
.icon-btn{width:34px;height:34px;border-radius:10px;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s}
.icon-btn:hover{background:var(--border);transform:scale(1.08)}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:10px}
.welcome-icon{font-size:48px;animation:pulse 3s infinite}

/* MESSAGES */
#messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:2px}
.msg-g{display:flex;gap:6px;align-items:flex-end;animation:slideUp .25s var(--ease)}
.msg-g.mine{flex-direction:row-reverse}
.msg-g.gtop{margin-top:8px}
.msg-av{width:30px;height:30px;border-radius:10px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--panel);color:var(--text);cursor:pointer;overflow:hidden}
.msg-av img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.msg-ph{width:30px;flex-shrink:0}
.msg-c{display:flex;flex-direction:column;max-width:68%}
.msg-g.mine .msg-c{align-items:flex-end}
.msg-name{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:2px;padding:0 4px}
.msg-bubble{padding:8px 12px;border-radius:var(--radius);font-size:14px;line-height:1.55;word-break:break-word;transition:transform .1s}
.msg-bubble:active{transform:scale(.98)}
.msg-bubble.mine{background:var(--bubble-mine);color:var(--bubble-mine-text);border-bottom-left-radius:4px}
.msg-bubble:not(.mine){background:var(--bubble-other);color:var(--bubble-other-text);border:1px solid var(--border);border-bottom-right-radius:4px}
.msg-bubble img{max-width:260px;max-height:260px;border-radius:10px;display:block;cursor:pointer;margin-top:4px}
.msg-bubble video{max-width:260px;max-height:260px;border-radius:10px;display:block;margin-top:4px}
.msg-bubble audio{max-width:220px;width:100%;margin-top:4px;border-radius:8px}
.msg-bubble .file-link{display:flex;align-items:center;gap:6px;padding:6px 10px;background:rgba(255,255,255,.06);border-radius:8px;margin-top:4px;text-decoration:none;color:var(--text);font-size:12px}
.msg-bubble .file-link:hover{background:rgba(255,255,255,.12)}
.reply-preview{border-right:3px solid var(--accent);padding:4px 8px;margin-bottom:4px;border-radius:0 8px 8px 0;background:rgba(124,109,250,.06);font-size:11px}
.reply-preview .rp-name{color:var(--accent);font-weight:600;font-size:10px}
.reply-preview .rp-text{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reactions-row{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.r-chip{display:inline-flex;align-items:center;gap:2px;padding:2px 6px;border-radius:99px;background:var(--panel);border:1px solid var(--border);font-size:11px;cursor:pointer;transition:all .15s;user-select:none}
.r-chip:hover{border-color:var(--accent);transform:scale(1.05)}
.r-chip.mine{background:rgba(124,109,250,.12);border-color:var(--accent)}
.msg-meta{font-size:10px;color:var(--muted);margin-top:2px;padding:0 4px}
.msg-g.mine .msg-meta{text-align:left}
.msg-check{color:var(--accent);font-size:11px}
.msg-menu{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,.5);min-width:150px;animation:scaleIn .15s var(--ease)}
.msg-menu-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:13px;width:100%;text-align:right;transition:background .1s;color:var(--text);cursor:pointer}
.msg-menu-item:hover{background:var(--panel)}
.msg-menu-item.danger{color:var(--red)}
.msg-menu-sep{height:1px;background:var(--border);margin:2px 0}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;opacity:.35}
.empty-icon{font-size:44px}
.empty-txt{font-size:12px;color:var(--muted)}

/* VOICE BAR */
#voice-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;display:none;align-items:center;gap:12px;flex-shrink:0}
#voice-bar.show{display:flex}
.vb-members{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.vm-chip{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;background:var(--panel);border:1px solid var(--border);font-size:12px}
.vm-av{width:20px;height:20px;border-radius:50%;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.vm-name{font-size:12px;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vb-join{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.2);transition:all .15s;white-space:nowrap}
.vb-join:hover{background:rgba(34,197,94,.22)}
.vb-join.leave{background:rgba(229,51,74,.1);color:var(--red);border-color:rgba(229,51,74,.25)}

/* MEET-LIKE CALL PANEL */
#callPanel{position:fixed;inset:0;z-index:150;display:none;flex-direction:column;background:#0a0e14}
#callPanel.show{display:flex}
.call-top{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.3);backdrop-filter:blur(8px);flex-shrink:0}
.call-top h3{font-size:14px;font-weight:600;color:#fff;display:flex;align-items:center;gap:8px}
.call-top .call-badge{font-size:10px;padding:3px 8px;border-radius:99px;background:rgba(77,205,94,.2);color:var(--green);animation:pulse 2s infinite}
.call-grid{flex:1;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:12px;padding:20px;overflow-y:auto}
.call-tile{width:180px;height:140px;border-radius:16px;background:var(--bg3,#1e2c3a);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative;border:2px solid transparent;transition:border-color .3s}
.call-tile.speaking{border-color:var(--green);box-shadow:0 0 20px rgba(34,197,94,.3)}
.call-tile.is-me{border-color:var(--accent)}
.call-tile .tile-av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff}
.call-tile .tile-name{font-size:13px;font-weight:600;color:#fff}
.call-tile .tile-status{font-size:10px;color:var(--text2,#8b9bab)}
.call-tile .tile-mic{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--green)}
.call-tile .tile-mic.muted{color:var(--red)}
.call-tile video{width:100%;height:100%;object-fit:cover;border-radius:14px;position:absolute;inset:0}
.call-tile .tile-name-overlay{position:absolute;bottom:8px;left:8px;right:8px;font-size:11px;font-weight:600;color:#fff;background:rgba(0,0,0,.5);padding:4px 8px;border-radius:6px;text-align:center;backdrop-filter:blur(4px)}
.call-tile.screen-sharing{width:100%;max-width:640px;height:360px;flex-grow:1}
.call-tile.screen-sharing video{object-fit:contain;border-radius:14px}
.call-screen{width:100%;max-width:640px;border-radius:12px;overflow:hidden;background:#000;margin-bottom:12px;position:relative}
.call-screen video{width:100%;display:block;border-radius:12px}
.call-screen-label{position:absolute;top:8px;left:8px;font-size:11px;font-weight:600;color:#fff;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:6px;backdrop-filter:blur(4px)}
.call-controls{padding:16px;display:flex;justify-content:center;gap:12px;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);flex-shrink:0}
.call-ctrl{width:48px;height:48px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:all .2s}
.call-ctrl:hover{transform:scale(1.1)}
.call-ctrl.mic{background:var(--bg3,#1e2c3a);color:#fff}
.call-ctrl.mic.off{background:var(--red);color:#fff}
.call-ctrl.screen{background:var(--bg3,#1e2c3a);color:#fff}
.call-ctrl.screen.active{background:var(--accent);color:#fff}
.call-ctrl.leave{background:var(--red);color:#fff;width:56px;border-radius:16px}
.call-ctrl.leave:hover{background:#dc2626}
@media(max-width:768px){.call-tile{width:140px;height:110px}.call-tile .tile-av{width:44px;height:44px;font-size:18px}.call-screen{max-width:100%}}

/* INPUT */
#input-bar{padding:8px 12px 12px;background:var(--surface);border-top:1px solid var(--border);display:none;flex-direction:column;gap:6px;flex-shrink:0;min-height:56px;position:relative;z-index:5}
#input-bar.show{display:flex!important}
.reply-bar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(124,109,250,.06);border-top:1px solid rgba(124,109,250,.15)}
.reply-bar-content{flex:1;min-width:0}
.reply-bar-name{font-size:10px;color:var(--accent);font-weight:600}
.reply-bar-text{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emoji-strip{display:flex;gap:2px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.emoji-strip::-webkit-scrollbar{height:0}
.emoji-btn{width:30px;height:30px;border-radius:8px;font-size:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:transform .1s;cursor:pointer}
.emoji-btn:hover{background:var(--panel);transform:scale(1.15)}
.irow{display:flex;gap:6px;align-items:flex-end}
#msg-input{flex:1;padding:10px 14px;background:var(--panel);border:1.5px solid var(--border);border-radius:14px;font-size:14px;resize:none;max-height:110px;line-height:1.5;transition:border-color var(--ease)}
#msg-input:focus{border-color:var(--accent)}
#msg-input::placeholder{color:var(--muted)}
.btn-send{width:40px;height:40px;border-radius:12px;flex-shrink:0;background:var(--accent);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;transition:transform .15s;box-shadow:0 3px 12px rgba(124,109,250,.3)}
.btn-send:hover{transform:scale(1.08) rotate(-8deg)}
.btn-send:active{transform:scale(.9)}
.btn-send.sent{animation:sendPop .25s}
.attach-btn,.camera-btn{width:40px;height:40px;border-radius:12px;flex-shrink:0;background:var(--panel);border:1.5px solid var(--border);color:var(--muted);font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .15s;cursor:pointer}
.attach-btn:hover,.camera-btn:hover{background:var(--border);color:var(--text)}
.media-preview{display:none;padding:4px 0;position:relative}
.media-preview img,.media-preview video{max-width:160px;max-height:100px;border-radius:8px;display:block}
.upload-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.upload-overlay.show{display:flex}
.upload-card{background:var(--surface);border-radius:16px;padding:24px;width:280px;text-align:center;border:1px solid var(--border);animation:scaleIn .3s var(--ease)}
.upload-icon{width:60px;height:60px;border-radius:50%;background:var(--accent-dim,rgba(124,109,250,.15));display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px;color:var(--accent);animation:uploadPulse 1.5s ease-in-out infinite}
@keyframes uploadPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 var(--accent)}50%{transform:scale(1.05);box-shadow:0 0 0 10px rgba(124,109,250,0)}}
.upload-text{font-size:14px;font-weight:600;margin-bottom:4px}
.upload-sub{font-size:12px;color:var(--muted);margin-bottom:16px}
.upload-bar{height:4px;background:var(--panel);border-radius:99px;overflow:hidden;margin-bottom:8px}
.upload-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .3s;width:0%}
.upload-pct{font-size:12px;color:var(--accent);font-weight:600}
.cancel-media{position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}

/* PROFILE */
#profile-overlay{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:210;display:none;align-items:center;justify-content:center;padding:20px;transition:background .25s}
#profile-overlay.show{display:flex;background:rgba(0,0,0,.55)}
#profile-card{background:var(--surface);border-radius:20px;width:100%;max-width:340px;max-height:85vh;overflow-y:auto;transform:scale(.95);opacity:0;transition:all .25s var(--ease)}
#profile-overlay.show #profile-card{transform:scale(1);opacity:1}
.pf-header{height:80px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:20px 20px 0 0;position:relative}
.pf-close{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.3);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.pf-avatar-wrap{width:72px;height:72px;border-radius:50%;margin:-36px auto 0;border:3px solid var(--surface);background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;position:relative}
.pf-avatar-wrap img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.pf-upload{position:absolute;bottom:0;right:0;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid var(--surface);cursor:pointer}
.pf-upload input{display:none}
.pf-body{padding:12px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:4px}
.pf-name{font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px}
.pf-email{font-size:12px;color:var(--muted)}
.pf-role-badge{padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;margin-top:4px}
.pf-role-badge.owner{background:rgba(124,109,250,.12);color:var(--accent)}
.pf-role-badge.admin{background:rgba(250,109,155,.12);color:var(--accent2)}
.pf-role-badge.user{background:var(--panel);color:var(--muted)}
.pf-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:12px}
.pf-stat{background:var(--panel);border-radius:10px;padding:10px;text-align:center}
.pf-stat-val{font-size:16px;font-weight:700}
.pf-stat-lbl{font-size:10px;color:var(--muted);margin-top:2px}

/* THEME */
#theme-overlay{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:200;display:none;align-items:flex-end;justify-content:center;transition:background .25s}
#theme-overlay.show{display:flex;background:rgba(0,0,0,.5)}
#theme-panel{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:440px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;transform:translateY(100%);transition:transform .3s var(--ease)}
#theme-overlay.show #theme-panel{transform:translateY(0)}
.tp-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.tp-title{font-size:15px;font-weight:700}
.tp-body{overflow-y:auto;padding:12px 16px 20px}
.tp-presets{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tp-presets::-webkit-scrollbar{height:0}
.p-chip{flex-shrink:0;width:64px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px;border-radius:12px;border:1.5px solid var(--border);background:var(--panel);transition:all .15s;cursor:pointer}
.p-chip:hover{border-color:var(--accent)}
.p-chip.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(124,109,250,.15)}
.p-swatch{width:40px;height:40px;border-radius:10px;display:flex;overflow:hidden;position:relative}
.p-swatch span{flex:1;height:100%}
.p-label{font-size:9px;color:var(--muted);text-align:center}
.p-chip.p-bh .p-swatch{background:radial-gradient(circle,#000 0% 35%,#ff6a00 55%,#000 80%)}
.p-bh-core{position:absolute;inset:0;z-index:2;border-radius:10px;overflow:hidden}
.p-bh-core::before{content:'';position:absolute;inset:0;background:conic-gradient(from 0deg,transparent,#ff6a00 60deg,transparent 120deg,#fff 180deg,transparent 240deg,#ff6a00 300deg,transparent 360deg);animation:blackholeSpin 2.5s linear infinite;opacity:.8}
.p-bh-core::after{content:'';position:absolute;inset:30%;border-radius:50%;background:#000;box-shadow:0 0 8px 2px rgba(255,106,0,.4)}
.p-chip.p-bh .p-label{color:#ff6a00;font-weight:700;animation:blackholePulse 1.6s infinite}
.tp-actions{display:flex;gap:6px;padding-top:8px}
.tp-btn{flex:1;padding:10px;border-radius:10px;font-size:12px;font-weight:600;background:var(--panel);border:1px solid var(--border);transition:all .15s}
.tp-btn:hover{background:var(--border)}
.tp-btn.primary{background:var(--accent);color:#fff;border:none}

/* DM PANEL */
.dm-panel{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:205;display:none;align-items:flex-end;justify-content:center;transition:background .25s}
.dm-panel.show{display:flex;background:rgba(0,0,0,.5)}
.dm-box{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:440px;height:80vh;display:flex;flex-direction:column;overflow:hidden;transform:translateY(100%);transition:transform .3s var(--ease)}
.dm-panel.show .dm-box{transform:translateY(0)}
.dm-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);gap:8px}
.dm-header h3{font-size:15px;font-weight:700;flex-shrink:0}
.dm-search{flex:1;padding:8px 12px;background:var(--panel);border:1px solid var(--border);border-radius:10px;font-size:13px;color:var(--text)}
.dm-search:focus{border-color:var(--accent)}
.dm-body{flex:1;overflow-y:auto;padding:8px 0}
.dm-user{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;transition:background .15s}
.dm-user:hover{background:var(--panel)}
.dm-user-av{width:42px;height:42px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;overflow:hidden}
.dm-user-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.dm-user-info{flex:1;min-width:0;border-bottom:1px solid var(--border);padding:6px 0}
.dm-user:last-child .dm-user-info{border-bottom:none}
.dm-user-name{font:500 13px inherit}
.dm-user-role{font-size:11px;color:var(--muted)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:220}
.modal-overlay.show{display:flex}
.modal-card{background:var(--surface);border-radius:16px;padding:20px;width:90%;max-width:340px;border:1px solid var(--border);animation:scaleIn .2s}
.modal-card h2{font:700 15px inherit;margin-bottom:14px}
.modal-card input,.modal-card select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);font:13px inherit;margin-bottom:8px}
.modal-card input:focus{border-color:var(--accent)}
.modal-btns{display:flex;gap:6px;margin-top:12px}
.modal-btns .btn{flex:1;padding:9px;border-radius:8px;font:600 12px inherit;text-align:center}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:var(--panel);color:var(--muted);border:1px solid var(--border)}

/* TOAST */
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(16px) scale(.95);background:var(--panel);border:1px solid var(--border);padding:8px 16px;border-radius:99px;font-size:12px;opacity:0;transition:all .25s var(--ease);pointer-events:none;z-index:99;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}

/* MOBILE */
.menu-btn{display:none;position:fixed;top:10px;right:10px;z-index:55;width:36px;height:36px;border-radius:50%;background:var(--panel);align-items:center;justify-content:center;font-size:14px}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
.sidebar-overlay.show{display:block}
@media(max-width:768px){
  .sidebar{position:fixed;right:0;top:0;height:100%;width:260px;transform:translateX(100%)}
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:flex}
  .msg-c{max-width:82%}
  input,textarea{font-size:16px!important}
  .room-item,.dm-item{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #input-bar{padding-bottom:env(safe-area-inset-bottom,8px)}
  #input-bar.show{display:flex!important}
  #messages{padding-bottom:8px}
}
</style>
</head>
<body data-theme="default">
<div id="app">

<div id="bh-vis" aria-hidden="true">

<!-- AUTH -->
<div id="auth">
  <div class="auth-ui">

    <div class="auth-card">
      <div class="auth-tabs">

        <button class="auth-tab" data-tab="register">ثبت‌نام</button>

        <div class="fg"><label>ایمیل</label><input type="email" id="loginEmail" placeholder="example@email.com" required></div>

        <div class="auth-err" id="authErr"></div>
        <button type="submit" class="auth-btn">ورود ←</button>
      </form>
      <form id="registerForm" class="auth-form">

        <div class="fg"><label>ایمیل</label><input type="email" id="regEmail" placeholder="example@email.com" required></div>
        <div class="fg"><label>رمز عبور</label><input type="password" id="regPass" placeholder="حداقل ۶ کاراکتر" required minlength="6"></div>
        <div class="auth-err" id="authErr2"></div>

<!-- SIDEBAR -->
<button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<aside class="sidebar" id="sidebar">

    <div class="sb-info"><div class="sb-name" id="hname" onclick="openMyProfile()"></div><span class="sb-role" id="hrole"></span></div>

  </div>
  <div class="sb-body">

    <div class="sb-section"><div class="sb-sec-head"><span class="sb-sec-title">صوتی</span><button class="btn-add" id="addVoiceBtn" onclick="openCreateRoom('voice')"><i class="fas fa-plus"></i></button></div><div id="voiceRooms"></div></div>

<div id="theme-overlay" onclick="if(event.target===this)closeThemePanel()">

    <div class="tp-body">
      <div style="margin-bottom:14px"><div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:8px">پیش‌فرض‌ها</div><div class="tp-presets" id="tp-presets"></div></div>

$('registerForm').onsubmit = async function(e) {

    const { count } = await db.from('profiles').select('*', { count: 'exact', head: true });

    const { count } = await db.from('profiles').select('*', { count: 'exact', head: true });

async function startPresence() {
  if (presenceChannel) await db.removeChannel(presenceChannel);
  presenceChannel = db.channel('online-users');
  presenceChannel.on('presence', { event: 'sync' }, function() { rOnline(presenceChannel.presenceState()); })
    .on('presence', { event: 'join' }, function() { rOnline(presenceChannel.presenceState()); })
    .on('presence', { event: 'leave' }, function() { rOnline(presenceChannel.presenceState()); });
  await presenceChannel.subscribe(async function(s) {
    if (s === 'SUBSCRIBED') {
      await presenceChannel.track({ user_id: me.id, username: myProfile.username, display_name: myProfile.display_name });
    }
  });
}

function rOnline(state) {
  const l = $('onlineList');
  l.innerHTML = '';
  const seen = new Set();
  for (const [, p] of Object.entries(state)) {
    for (const u of p) {
      if (seen.has(u.user_id)) continue;
      seen.add(u.user_id);
      const d = document.createElement('div');
      d.className = 'online-item';
      d.innerHTML = '<span class="online-dot"></span><span>' + esc(u.display_name || u.username) + (u.user_id === me.id ? ' (شما)' : '') + '</span>';
      l.appendChild(d);
    }
  }
}

async function openDm(userId, userName) {
  if (dmSub) { await db.removeChannel(dmSub); dmSub = null; }

  $('welcome').style.display = 'none'; $('messages').style.display = 'flex'; $('chatHeader').style.display = 'flex';
  $('roomTitle').textContent = userName; $('roomBadge').textContent = 'خصوصی'; $('roomBadge').className = 'chat-badge';
  $('input-bar').classList.add('show'); $('voiceActions').style.display = 'none'; $('voice-bar').classList.remove('show');

let msgSub = null;
async function openRoom(id, name, type) {
  if (msgSub) { await db.removeChannel(msgSub); msgSub = null; }

  curRoom = id; curType = type; curDm = null;

  $('roomTitle').textContent = name;

  $('input-bar').classList.toggle('show', type === 'text');
  $('voiceActions').style.display = type === 'voice' ? 'flex' : 'none';
  $('voice-bar').classList.toggle('show', type === 'voice');
  document.querySelectorAll('.room-item,.dm-item').forEach(function(el) { el.classList.remove('active'); });

  if (activeEl) activeEl.classList.add('active');

  $('messages').innerHTML = '';

    $('messages').style.display = 'flex';
    const { data } = await db.from('messages').select('*, profiles:user_id (id,username,display_name,role,avatar_url)').eq('room_id', id).order('created_at').limit(100);
    if (data) data.forEach(function(m) { addMsg(m); });
    scrollBottom();
    lastMsgTime = data && data.length ? data[data.length - 1].created_at : null;
    msgSub = db.channel('room:' + id).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'room_id=eq.' + id }, async function(p) {
      const { data: msg } = await db.from('messages').select('*, profiles:user_id (id,username,display_name,role,avatar_url)').eq('id', p.new.id).single();
      if (msg) addMsg(msg);
    }).subscribe();
  } else {
    // Voice room - show welcome message
    $('messages').style.display = 'flex';
    $('messages').innerHTML = '<div class="empty"><div class="empty-icon">🔊</div><div class="empty-txt">اتاق صوتی فعاله</div></div>';

}

let lastUid = '';
function addMsg(m) {
  const c = $('messages'), d = document.createElement('div');
  const own = m.user_id === (me && me.id);
  const u = m.profiles;
  const time = new Date(m.created_at).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
  const gapTop = m.user_id !== lastUid;
  lastUid = m.user_id;
  let content = '';
  if (m.type === 'text') content = esc(m.content);
  else if (m.type === 'image') content = '<img src="' + m.file_url + '" loading="lazy" onclick="window.open(\'' + m.file_url + '\',\'_blank\')">';
  else if (m.type === 'video') content = '<video src="' + m.file_url + '" controls style="max-width:260px;border-radius:10px"></video>';
  else if (m.type === 'voice') content = '<audio controls src="' + m.file_url + '" style="max-width:220px"></audio>';
  else if (m.type === 'file') content = '<a href="' + m.file_url + '" class="file-link" target="_blank"><i class="fas fa-file"></i> ' + esc(m.file_name || 'فایل') + '</a>';
  let replyHtml = '';
  if (m.reply_to_text) replyHtml = '<div class="reply-preview"><div class="rp-name">' + esc(m.reply_to_name || '') + '</div><div class="rp-text">' + esc(m.reply_to_text).slice(0, 50) + '</div></div>';
  d.className = 'msg-g ' + (own ? 'mine' : '') + ' ' + (gapTop ? 'gtop' : '');
  var msgId = m.id;
  var avStyle = own ? 'background:var(--accent);color:#fff' : 'background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff';
  var avContent = (u && u.avatar_url) ? '<img src="' + esc(u.avatar_url) + '" alt=""/>' : ((u && u.display_name || '?').charAt(0).toUpperCase());
  d.innerHTML = (gapTop ? '<div class="msg-av" onclick="openProfile(\'' + esc(u && u.display_name || '?') + '\')" style="' + avStyle + '">' + avContent + '</div>' : '<div class="msg-ph"></div>') +
    '<div class="msg-c">' + (!own && gapTop ? '<div class="msg-name" onclick="openProfile(\'' + esc(u && u.display_name || '') + '\')">' + esc(u && u.display_name || '') + '</div>' : '') +
    '<div class="msg-bubble' + (own ? ' mine' : '') + '">' + replyHtml + content + '</div>' +
    '<div class="reactions-row" id="reactions-' + msgId + '"></div>' +
    '<div class="msg-meta"><span>' + time + '</span>' + (own ? '<span class="msg-check"><i class="fas fa-check-double"></i></span>' : '') + '</div></div>';
  c.appendChild(d);
  var bubble = d.querySelector('.msg-bubble');
  var pt = null;
  var openMenu = function() { showMsgMenu(msgId, m.content || '', d, own); };

async function sendMedia(inp, cap) {
  var file = pendingMediaFile, isV = pendingMediaIsVideo;
  cancelMedia(); inp.value = ''; inp.style.height = '';
  var ext = (file.name.split('.').pop() || (isV ? 'mp4' : 'jpg')).toLowerCase().replace(/[^a-z0-9]/g, '');
  var path = Date.now() + '.' + (ext || 'jpg');
  var bucket = isV ? 'chat-videos' : 'chat-images';
  // Show upload overlay
  var overlay = $('uploadOverlay');
  var barFill = $('uploadBarFill');
  var pctEl = $('uploadPct');
  var textEl = $('uploadText');
  var subEl = $('uploadSub');
  overlay.classList.add('show');
  barFill.style.width = '0%';
  pctEl.textContent = '0%';
  textEl.textContent = isV ? 'در حال آپلود ویدیو...' : 'در حال آپلود عکس...';
  subEl.textContent = file.name;
  // Animate progress
  var progress = 0;
  var progressInterval = setInterval(function() {
    progress = Math.min(progress + Math.random() * 15, 90);
    barFill.style.width = progress + '%';
    pctEl.textContent = Math.round(progress) + '%';
  }, 200);
  try {
    var upErr = (await db.storage.from(bucket).upload(path, file, { upsert: true })).error;
    clearInterval(progressInterval);
    if (upErr) throw upErr;
    barFill.style.width = '100%';
    pctEl.textContent = '100%';
    textEl.textContent = '✅ آپلود کامل شد';
    subEl.textContent = 'در حال ارسال پیام...';
    await new Promise(function(r) { setTimeout(r, 500); });
    overlay.classList.remove('show');
    var ud = db.storage.from(bucket).getPublicUrl(path);
    var type = isV ? 'video' : file.type.startsWith('image/') ? 'image' : 'file';
    var md = { room_id: curRoom, user_id: me.id, type: type, content: cap || file.name, file_url: ud.data.publicUrl, file_name: file.name, file_size: file.size };
    if (replyToData) { md.reply_to_id = replyToData.id; md.reply_to_name = replyToData.name; md.reply_to_text = replyToData.text; }
    cancelReply();
    await db.from('messages').insert(md);
    toast('✅ ارسال شد');
  } catch(e) {
    clearInterval(progressInterval);
    overlay.classList.remove('show');
    toast('❌ ' + e.message);
  }
}

// AUTO-CLEANUP: Delete uploaded files older than 3 hours (keeps profile avatars)
async function cleanupOldFiles() {
  var THREE_HOURS = 3 * 60 * 60 * 1000;
  var cutoff = Date.now() - THREE_HOURS;
  var buckets = ['chat-images', 'chat-videos'];
  for (var i = 0; i < buckets.length; i++) {
    try {
      var result = await db.storage.from(buckets[i]).list('');
      if (result.error || !result.data) continue;
      var files = result.data;
      for (var j = 0; j < files.length; j++) {
        var f = files[j];
        // Extract timestamp from filename (format: timestamp.ext)
        var ts = parseInt(f.name.split('.')[0], 10);
        if (!isNaN(ts) && ts < cutoff) {
          await db.storage.from(buckets[i]).remove([f.name]);
        }
      }
    } catch(e) {}
  }
}

// VOICE
let callTimerInterval = null, callSeconds = 0;

async function joinVoice() {
  try {
    myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    voiceChannel = db.channel('voice:' + curRoom);
    voiceChannel.on('broadcast', { event: 'join' }, async function(payload) {
      // Someone new joined - add them, create peer, and announce yourself back
      if (payload.payload.userId === me.id) return;
      voiceMembers.set(payload.payload.userId, { username: payload.payload.username });
      toast('🎙 ' + payload.payload.username + ' وارد صدا شد');
      renderCallGrid();
      // Create peer as initiator
      setTimeout(async function() {
        var pc = await createPeer(payload.payload.userId, true);
        // Add screen share track if active
        if (screenStream && screenStream.getVideoTracks().length > 0) {
          pc.addTrack(screenStream.getVideoTracks()[0], screenStream);
        }
      }, 300);
      // Announce yourself back so they can see you
      await voiceChannel.send({ type: 'broadcast', event: 'here', payload: { userId: me.id, username: myProfile.display_name || myProfile.username } });
    }).on('broadcast', { event: 'here' }, async function(payload) {
      // An existing member announced themselves - add them and connect
      if (payload.payload.userId === me.id) return;
      if (voiceMembers.has(payload.payload.userId)) return; // Already known
      voiceMembers.set(payload.payload.userId, { username: payload.payload.username });
      toast('🎙 ' + payload.payload.username + ' وارد صدا شد');
      renderCallGrid();
      // Don't create peer here - wait for their offer or create as non-initiator
    }).on('broadcast', { event: 'offer' }, async function(payload) {
      if (payload.payload.to !== me.id) return;
      // Make sure we know about this person
      if (!voiceMembers.has(payload.payload.from)) {
        voiceMembers.set(payload.payload.from, { username: 'کاربر' });
        renderCallGrid();
      }
      await handleOffer(payload.payload.from, payload.payload.offer);
    }).on('broadcast', { event: 'answer' }, async function(payload) {
      if (payload.payload.to !== me.id) return;
      await handleAnswer(payload.payload.from, payload.payload.answer);
    }).on('broadcast', { event: 'ice' }, async function(payload) {
      if (payload.payload.to !== me.id) return;
      await handleIce(payload.payload.from, payload.payload.candidate);
    }).on('broadcast', { event: 'leave' }, function(payload) {
      var m = voiceMembers.get(payload.payload.userId);
      if (m) toast('🔇 ' + m.username + ' خارج شد');
      voiceMembers.delete(payload.payload.userId);
      if (peers.has(payload.payload.userId)) { peers.get(payload.payload.userId).close(); peers.delete(payload.payload.userId); }
      renderCallGrid();
    }).subscribe(async function(status) {
      if (status === 'SUBSCRIBED') {
        voiceMembers.set(me.id, { username: myProfile.display_name || myProfile.username });
        showCallPanel();
        // Announce join - existing members will respond with 'here'
        await voiceChannel.send({ type: 'broadcast', event: 'join', payload: { userId: me.id, username: myProfile.display_name || myProfile.username } });
      }
    });
  } catch(e) { toast('❌ میکروفون'); }
}

async function createPeer(pid, init) {
  var pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, { urls: 'stun:stun2.l.google.com:19302' }] });
  peers.set(pid, pc);
  // Add audio track
  if (myStream) myStream.getAudioTracks().forEach(function(t) { pc.addTrack(t, myStream); });
  // Add screen share video track if active
  if (screenStream && screenStream.getVideoTracks().length > 0) {
    pc.addTrack(screenStream.getVideoTracks()[0], screenStream);
  }
  pc.onicecandidate = function(e) { if (e.candidate && voiceChannel) voiceChannel.send({ type: 'broadcast', event: 'ice', payload: { from: me.id, to: pid, candidate: e.candidate } }); };
  // Store remote streams per peer
  var remoteAudioStream = null, remoteVideoStream = null;
  pc.ontrack = function(e) {
    if (!e.streams || !e.streams[0]) return;
    var track = e.track;
    var stream = e.streams[0];
    if (track.kind === 'video') {
      // Screen share video received
      remoteVideoStream = stream;
      if (!voiceMembers.has(pid)) voiceMembers.set(pid, { username: 'کاربر' });
      renderCallGrid();
      var tile = document.getElementById('tile-' + pid);
      if (tile) {
        var vid = tile.querySelector('video');
        if (!vid) {
          vid = document.createElement('video');
          vid.autoplay = true; vid.playsInline = true;
          tile.insertBefore(vid, tile.firstChild);
          var av = tile.querySelector('.tile-av');
          if (av) av.style.display = 'none';
          var lbl = document.createElement('div');
          lbl.className = 'tile-name-overlay';
          lbl.textContent = (voiceMembers.get(pid) || {}).username;
          tile.appendChild(lbl);
        }
        vid.srcObject = stream;
      }
    } else {
      // Audio track
      remoteAudioStream = stream;
      $('remoteAudio').srcObject = stream;
    }
    var micInd = document.getElementById('mic-indicator-' + pid);
    if (micInd) micInd.className = 'tile-mic';
  };
  pc.onconnectionstatechange = function() { if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') { pc.close(); peers.delete(pid); renderCallGrid(); } };
  if (init) {
    var o = await pc.createOffer(); await pc.setLocalDescription(o);
    voiceChannel.send({ type: 'broadcast', event: 'offer', payload: { from: me.id, to: pid, offer: o } });
  }
  return pc;
}

async function handleOffer(from, offer) {
  if (peers.has(from)) return;
  if (!voiceMembers.has(from)) {
    voiceMembers.set(from, { username: 'کاربر' });
    renderCallGrid();
  }
  var pc = await createPeer(from, false);
  await pc.setRemoteDescription(new RTCSessionDescription(offer));
  var a = await pc.createAnswer(); await pc.setLocalDescription(a);
  voiceChannel.send({ type: 'broadcast', event: 'answer', payload: { from: me.id, to: from, answer: a } });
}

async function handleAnswer(from, answer) { var pc = peers.get(from); if (pc) await pc.setRemoteDescription(new RTCSessionDescription(answer)); }
async function handleIce(from, candidate) { var pc = peers.get(from); if (pc) try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch(e) {} }

function toggleMute() {

// SCREEN SHARE
let screenStream = null;

window.shareScreen = async function() {
  try {
    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
    // Show in self tile - make it BIG
    var selfTile = document.getElementById('tile-' + me.id);
    if (selfTile) {
      selfTile.classList.add('screen-sharing');
      var v = document.createElement('video');
      v.autoplay = true; v.playsInline = true; v.muted = true;
      selfTile.insertBefore(v, selfTile.firstChild);
      var av = selfTile.querySelector('.tile-av');
      if (av) av.style.display = 'none';
      v.srcObject = screenStream;
    }
    $('callScreenBtn').className = 'call-ctrl screen active';
    // Send screen video to all peers with renegotiation
    var videoTrack = screenStream.getVideoTracks()[0];
    var promises = [];
    peers.forEach(function(pc, pid) {
      var videoSender = pc.getSenders().find(function(s) { return s.track && s.track.kind === 'video'; });
      if (videoSender) {
        videoSender.replaceTrack(videoTrack);
      } else {
        pc.addTrack(videoTrack, screenStream);
      }
      // Force renegotiation
      promises.push(pc.createOffer().then(function(o) { return pc.setLocalDescription(o); }).then(function() {
        voiceChannel.send({ type: 'broadcast', event: 'offer', payload: { from: me.id, to: pid, offer: pc.localDescription } });
      }));
    });
    await Promise.all(promises);
    videoTrack.onended = function() { stopScreenShare(); };
    toast('🖥 صفحه اشتراک گذاشته شد');
  } catch(e) {
    if (e.name !== 'AbortError') toast('❌ اشتراک صفحه رد شد');
  }
};

window.stopScreenShare = function() {
  if (screenStream) {
    screenStream.getTracks().forEach(function(t) { t.stop(); });
    screenStream = null;
  }
  // Remove video from self tile
  var selfTile = document.getElementById('tile-' + me.id);
  if (selfTile) {
    var v = selfTile.querySelector('video');
    if (v) v.remove();
    var av = selfTile.querySelector('.tile-av');
    if (av) av.style.display = '';
    var label = selfTile.querySelector('.tile-name-overlay');
    if (label) label.remove();
  }
  var btn = $('callScreenBtn');
  if (btn) btn.className = 'call-ctrl screen';
  $('remoteVideo').srcObject = null;
  $('remoteVideo').style.display = 'none';
  // Restore audio-only tracks
  if (myStream) {
    var audioTrack = myStream.getAudioTracks()[0];
    peers.forEach(function(pc) {
      var sender = pc.getSenders().find(function(s) { return s.track && s.track.kind === 'audio'; });
      if (sender && audioTrack) sender.replaceTrack(audioTrack);
    });
  }
};

  var avH = data.avatar_url ? '<img src="' + esc(data.avatar_url) + '" alt=""/>' : (data.display_name || '?').charAt(0).toUpperCase();
  var upBtn = isMe ? '<label class="pf-upload"><i class="fas fa-camera"></i><input type="file" accept="image/*" onchange="uploadAvatar(this)"></label>' : '';
  var nmE = isMe ? '<div id="pf-ne" style="display:none;width:100%;gap:4px;margin-top:6px"><input id="pf-ni" value="' + esc(data.display_name || '') + '" maxlength="20" style="flex:1;padding:7px 10px;font-size:12px;background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--text)"><button onclick="saveName()" style="padding:7px 12px;border-radius:8px;background:var(--accent);color:#fff;font-size:11px;font-weight:600;border:none;cursor:pointer">ذخیره</button></div>' : '';
  var bio = isMe ? '<div style="width:100%;margin-top:10px"><div id="pf-bd" style="font-size:12px;color:var(--muted);text-align:center;cursor:pointer;padding:6px;border-radius:8px" onclick="toggleBio()">' + (data.bio ? esc(data.bio) : '<span style="opacity:.4">بیو… (کلیک)</span>') + '</div><div id="pf-be" style="display:none;flex-direction:column;gap:4px;width:100%"><textarea id="pf-bi" maxlength="120" rows="2" style="resize:none;font-size:12px;padding:7px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--border);color:var(--text)">' + esc(data.bio || '') + '</textarea><div style="display:flex;gap:4px"><button onclick="toggleBio()" style="flex:1;padding:6px;border-radius:8px;background:var(--panel);color:var(--muted);border:1px solid var(--border);font-size:11px;cursor:pointer">لغو</button><button onclick="saveBio()" style="flex:1;padding:6px;border-radius:8px;background:var(--accent);color:#fff;border:none;font-size:11px;font-weight:600;cursor:pointer">ذخیره</button></div></div></div>' : (data.bio ? '<div style="font-size:12px;color:var(--muted);text-align:center;padding:6px;margin-top:6px">' + esc(data.bio) + '</div>' : '');
  $('profile-body').innerHTML = '<div class="pf-avatar-wrap">' + avH + upBtn + '</div><div class="pf-name">' + esc(data.display_name || data.username) + (data.role === 'owner' ? ' 👑' : '') + (isMe ? ' <button onclick="toggleNE()" style="width:22px;height:22px;font-size:10px;background:var(--panel);border:none;border-radius:6px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center">✏️</button>' : '') + '</div>' + nmE + '<div class="pf-email">' + esc(data.username) + '</div><span class="pf-role-badge ' + data.role + '">' + rn + '</span>' + bio + '<div class="pf-stats"><div class="pf-stat"><div class="pf-stat-val">' + (mc || 0) + '</div><div class="pf-stat-lbl">پیام</div></div><div class="pf-stat"><div class="pf-stat-val">' + new Date(data.created_at).toLocaleDateString('fa-IR') + '</div><div class="pf-stat-lbl">عضویت</div></div></div>';
};

window.toggleNE = function() { var e = $('pf-ne'); if (!e) return; e.style.display = e.style.display === 'none' ? 'flex' : 'none'; if (e.style.display === 'flex') { $('pf-ni').focus(); $('pf-ni').select(); } };
window.saveName = async function() { var n = $('pf-ni').value.trim(); if (!n || n.length > 20) return; try { await db.from('profiles').update({ display_name: n }).eq('id', me.id); myProfile.display_name = n; $('hname').textContent = n + (myProfile.role === 'owner' ? ' 👑' : ''); openProfile(n); toast('✅'); } catch(e) { toast('❌'); } };
window.toggleBio = function() { var d = $('pf-bd'), e = $('pf-be'); if (!e) return; var s = e.style.display === 'none'; e.style.display = s ? 'flex' : 'none'; if (d) d.style.display = s ? 'none' : 'block'; };
window.saveBio = async function() {
  var bioEl = $('pf-bi');
  var bio = (bioEl ? bioEl.value : '').trim().slice(0, 120);
  try {
    var result = await db.from('profiles').update({ bio: bio }).eq('id', me.id);
    if (result.error) {
      if (result.error.message && result.error.message.includes('column')) {
        toast('❌ ستون bio وجود نداره! SQL اجرا کن');
      } else { toast('❌ ' + (result.error.message || 'خطا')); }
      return;
    }
    myProfile.bio = bio;
    openProfile(myProfile.display_name || myProfile.username);
    toast('✅');
  } catch(e) { toast('❌ ' + (e.message || 'خطا')); }
};
window.uploadAvatar = async function(input) {
  var f = input.files[0]; if (!f || f.size > 5 * 1024 * 1024) { toast('حداکثر ۵MB'); return; }
  try {
    toast('⏳');
    var ext = f.name.split('.').pop().toLowerCase().replace(/[^a-z0-9]/g, '');
    var path = 'avatar_' + me.id + '.' + ext;
    var result = await db.storage.from('avatars').upload(path, f, { upsert: true });
    if (result.error) {
      if (result.error.message && result.error.message.includes('Bucket not found')) {
        toast('❌ bucket وجود نداره! SQL اجرا کن');
      } else { toast('❌ ' + (result.error.message || 'خطا')); }
      return;
    }
    var ud = db.storage.from('avatars').getPublicUrl(path);
    await db.from('profiles').update({ avatar_url: ud.data.publicUrl }).eq('id', me.id);
    myProfile.avatar_url = ud.data.publicUrl;
    rAv($('hav'), myProfile);
    openProfile(myProfile.display_name || myProfile.username);
    toast('✅');
  } catch(e) { toast('❌ ' + (e.message || 'خطا')); }
};
window.openMyProfile = function() { if (myProfile) openProfile(myProfile.display_name || myProfile.username); };
window.closeProfile = function() { $('profile-overlay').classList.remove('show'); };
window.closeCallPanel = function() { leaveVoice(); };

function closeSidebar() { $('sidebar').classList.remove('open'); $('sidebarOverlay').classList.remove('show'); }
$('menuBtn').onclick = function() { $('sidebar').classList.add('open'); $('sidebarOverlay').classList.add('show'); };
$('sidebarOverlay').onclick = closeSidebar;
$('msg-input').addEventListener('keydown', function(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } });
$('msg-input').addEventListener('input', function() { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 110) + 'px'; });
function esc(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); setTimeout(function() { el.classList.remove('show'); }, 2200); }

applyTheme(curTheme);
loadSession();

// Fix Android keyboard - keep input visible
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', function() {
    var vh = window.visualViewport.height;
    document.documentElement.style.height = vh + 'px';
    document.body.style.height = vh + 'px';
    var app = $('app');
    if (app) app.style.height = vh + 'px';
  });
}
// Ensure input is visible when focused
document.addEventListener('focusin', function(e) {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') {
    setTimeout(function() {
      var inputBar = $('input-bar');
      if (inputBar) inputBar.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }, 400);
  }
});
</script>
</body>
</html>
