<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GapChat</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root{
      --bg:#0b0d12;--surface:#13161f;--panel:#1a1e2a;--border:#252a3a;
      --accent:#7c6dfa;--accent2:#fa6d9b;--teal:#2dd4bf;--green:#22c55e;
      --text:#e2e5f0;--muted:#6b7094;--red:#e5334a;
      --bubble-mine:#7c6dfa;--bubble-mine-text:#fff;
      --bubble-other:#13161f;--bubble-other-text:#e2e5f0;
      --font:'Vazirmatn',system-ui,sans-serif;--ease:.18s cubic-bezier(.4,0,.2,1);
      --radius:16px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    body{font-family:var(--font);background:var(--bg);color:var(--text);transition:background var(--ease),color var(--ease)}
    button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
    input,textarea{font-family:inherit;outline:none;border:none;background:none;color:inherit}
    ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}

    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    @keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes scaleIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
    @keyframes typing{0%,80%,100%{transform:scale(.6);opacity:.3}40%{transform:scale(1);opacity:1}}
    @keyframes sendPop{0%{transform:scale(.85)}50%{transform:scale(1.15) rotate(-12deg)}100%{transform:scale(1)}}
    @keyframes blackholeSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes blackholePulse{0%,100%{text-shadow:0 0 4px rgba(255,106,0,.4)}50%{text-shadow:0 0 12px rgba(255,106,0,.9)}}
    @keyframes bhOrbit{from{offset-distance:0%}to{offset-distance:100%}}
    @keyframes bhAmbientPulse{0%,100%{opacity:.7}50%{opacity:1}}

    /* ═══ BLACK HOLE VISUAL ═══ */
    #blackhole-visual{position:fixed;top:50%;left:50%;width:min(110vmin,820px);height:min(110vmin,820px);transform:translate(-50%,-50%);z-index:0;pointer-events:none;display:none}
    body[data-theme="blackhole"] #blackhole-visual{display:block}
    #blackhole-visual svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
    .bh-ambient{position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(circle,rgba(255,110,30,.10) 0%,rgba(255,70,0,.04) 40%,transparent 68%);animation:bhAmbientPulse 8s ease-in-out infinite}
    .bh-disk-group{animation:bhShimmer 5s ease-in-out infinite;transform-origin:200px 200px}
    @keyframes bhShimmer{0%,100%{opacity:.85}50%{opacity:1}}
    .bh-hotspots ellipse{offset-path:path("M 5 200 A 195 46 0 1 1 395 200 A 195 46 0 1 1 5 200");animation:bhOrbit 12s linear infinite;mix-blend-mode:screen}
    .bh-hotspots ellipse:nth-child(2){animation-delay:-6s}
    body[data-theme="blackhole"]{--bg:#000;--surface:#000;--panel:#0a0a0a;--border:#1a1a1a;--accent:#ff6a00;--accent2:#fff;--text:#fff;--muted:#555;--bubble-mine:#000;--bubble-mine-text:#fff;--bubble-other:#0a0a0a;--bubble-other-text:#fff}
    body[data-theme="blackhole"] header,body[data-theme="blackhole"] .sidebar{border-color:#1a1a1a}
    body[data-theme="blackhole"] .msg-avatar{background:radial-gradient(circle,#000 0% 30%,#ff6a00 60%,#000 100%)!important;box-shadow:0 0 10px rgba(255,106,0,.5)}
    body[data-theme="blackhole"] #app::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 50% 100%,rgba(255,106,0,.08) 0%,transparent 55%)}
    body[data-theme="blackhole"] .msg-bubble.own{box-shadow:0 0 12px rgba(255,106,0,.25)}
    body[data-theme="blackhole"] .btn-send{background:linear-gradient(135deg,#ff6a00,#000);box-shadow:0 4px 16px rgba(255,106,0,.4)}

    /* ═══ AUTH ═══ */
    #auth{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
    #auth::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at center,transparent 22%,rgba(2,3,9,.82) 100%);pointer-events:none}
    #auth-ui{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;gap:20px;animation:slideUp .6s cubic-bezier(.16,1,.3,1) both}
    .auth-brand{font-size:36px;font-weight:900;letter-spacing:-1px;background:linear-gradient(130deg,#fff 0%,var(--accent) 28%,var(--accent2) 60%,var(--teal) 85%,#fff 100%);background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:authGrad 6s ease infinite;text-align:center}
    @keyframes authGrad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
    .auth-tag{font-size:11px;color:var(--muted);letter-spacing:5px;text-transform:uppercase;margin-top:5px;display:block;text-align:center}
    .auth-card{position:relative;background:linear-gradient(145deg,rgba(8,12,26,.97),rgba(14,18,36,.94));border:1px solid rgba(124,109,250,.18);border-radius:28px;padding:30px 26px;width:358px;max-width:calc(100vw - 32px);display:flex;flex-direction:column;gap:16px;backdrop-filter:blur(28px);box-shadow:0 0 0 1px rgba(124,109,250,.07),0 28px 80px -16px rgba(0,0,0,.95),0 0 60px -20px rgba(124,109,250,.12),inset 0 1px 0 rgba(255,255,255,.07);animation:scaleIn .5s cubic-bezier(.16,1,.3,1) .1s both}
    .auth-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;border-radius:28px 28px 0 0;background:linear-gradient(90deg,transparent,rgba(124,109,250,.9),rgba(250,109,155,.7),rgba(45,212,191,.7),transparent);background-size:200% 100%;animation:shimmer 4s linear infinite}
    @keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
    .auth-tabs{display:flex;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:4px;gap:4px}
    .auth-tab{flex:1;padding:10px;border-radius:11px;font-size:13px;font-weight:700;color:var(--muted);transition:color .2s;text-align:center;position:relative;z-index:1}
    .auth-tab.active{color:var(--text)}
    .auth-tab.active::before{content:'';position:absolute;inset:0;border-radius:11px;z-index:-1;background:linear-gradient(135deg,rgba(124,109,250,.22),rgba(250,109,155,.12));border:1px solid rgba(124,109,250,.28);box-shadow:0 2px 14px rgba(124,109,250,.15),inset 0 1px 0 rgba(255,255,255,.09)}
    .auth-form{display:none;flex-direction:column;gap:14px}.auth-form.active{display:flex}
    .form-group{display:flex;flex-direction:column;gap:6px}
    .form-group label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
    .form-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
    .form-group input{padding:13px 14px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);border-radius:13px;font-size:14px;color:var(--text);transition:border-color .25s,background .25s,box-shadow .25s}
    .form-group input:focus{border-color:rgba(124,109,250,.55);background:rgba(124,109,250,.07);box-shadow:0 0 0 3px rgba(124,109,250,.12),0 0 24px rgba(124,109,250,.1)}
    .form-group input::placeholder{color:var(--muted)}
    .auth-btn{position:relative;overflow:hidden;padding:15px;border-radius:14px;font-size:15px;font-weight:800;color:#fff;letter-spacing:.5px;background:linear-gradient(135deg,#7c6dfa 0%,#a855f7 35%,#fa6d9b 70%,#7c6dfa 100%);background-size:260% 260%;animation:authBtnGrad 5s ease infinite;box-shadow:0 4px 22px rgba(124,109,250,.48),0 0 44px rgba(124,109,250,.14),inset 0 1px 0 rgba(255,255,255,.22);transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s}
    @keyframes authBtnGrad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
    .auth-btn::before{content:'';position:absolute;top:0;left:-110%;width:55%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);transition:left .55s ease}
    .auth-btn:hover::before{left:155%}
    .auth-btn:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 10px 36px rgba(124,109,250,.7),0 0 70px rgba(124,109,250,.22)}
    .auth-btn:active{transform:scale(.97)}.auth-btn:disabled{opacity:.6;pointer-events:none}
    .auth-err{font-size:12px;color:var(--red);text-align:center;min-height:18px;display:flex;align-items:center;justify-content:center}
    .auth-err:not(:empty){animation:shake .4s ease}
    .auth-status{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:14px;background:rgba(6,9,20,.88);border:1px solid rgba(124,109,250,.14);border-radius:99px;padding:7px 18px;backdrop-filter:blur(16px);font-size:11px;color:var(--muted);letter-spacing:1px}
    .auth-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2s ease-in-out infinite}

    /* ═══ APP LAYOUT ═══ */
    #app{display:none;height:100vh;width:100vw;position:relative;z-index:1}
    #app.show{display:flex}
    #app::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0}

    /* ═══ SIDEBAR ═══ */
    .sidebar{width:260px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;z-index:10;transition:transform .3s cubic-bezier(.4,0,.2,1)}
    .sb-head{padding:14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
    .avatar{width:38px;height:38px;border-radius:11px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;background:var(--panel);color:var(--text);flex-shrink:0;cursor:pointer;transition:transform .15s;overflow:hidden}
    .avatar:hover{transform:scale(1.08)}
    .avatar img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
    .sb-info{flex:1;min-width:0}
    .sb-name{font:600 13px inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sb-role{font-size:10px;padding:2px 8px;border-radius:6px;display:inline-block;margin-top:2px}
    .sb-role.owner{background:rgba(124,109,250,.15);color:var(--accent)}
    .sb-role.admin{background:rgba(250,109,155,.15);color:var(--accent2)}
    .sb-role.user{background:var(--panel);color:var(--muted)}
    .sb-body{flex:1;overflow-y:auto;padding:10px 8px}
    .sb-section{margin-bottom:14px}
    .sb-sec-head{display:flex;justify-content:space-between;align-items:center;padding:0 8px;margin-bottom:5px}
    .sb-sec-title{font:700 10px inherit;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
    .btn-add{width:20px;height:20px;border:none;background:transparent;color:var(--muted);border-radius:6px;cursor:pointer;font-size:12px;display:none;align-items:center;justify-content:center;transition:all .2s}
    .btn-add.show{display:flex}.btn-add:hover{background:var(--accent);color:#fff}
    .room-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:all .15s;margin-bottom:1px;color:var(--muted);font:500 13px inherit}
    .room-item:hover{background:var(--panel);color:var(--text)}
    .room-item.active{background:rgba(124,109,250,.12);color:var(--accent)}
    .room-item i{width:16px;text-align:center;font-size:12px;opacity:.7}
    .room-item.active i{opacity:1}
    .room-item span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .online-item{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:8px;font-size:12px;color:var(--muted)}
    .online-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 6px var(--green)}
    .sb-foot{padding:10px;border-top:1px solid var(--border)}
    .btn-logout{width:100%;padding:9px;border:none;border-radius:8px;background:rgba(229,51,74,.1);color:var(--red);font:500 12px inherit;cursor:pointer;transition:all .2s}
    .btn-logout:hover{background:var(--red);color:#fff}

    /* ═══ MAIN ═══ */
    .main{flex:1;display:flex;flex-direction:column;background:var(--bg);min-width:0;position:relative;z-index:1}
    .chat-header{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--surface);flex-shrink:0}
    .chat-title{display:flex;align-items:center;gap:10px;min-width:0}
    .chat-title h2{font:600 15px inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .chat-badge{font-size:10px;padding:3px 8px;border-radius:6px;background:var(--panel);color:var(--muted)}
    .chat-badge.voice{background:rgba(34,197,94,.12);color:var(--green)}
    .chat-actions{display:flex;gap:6px;align-items:center}
    .icon-btn{width:34px;height:34px;border-radius:10px;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s}
    .icon-btn:hover{background:var(--border);transform:scale(1.08)}
    .icon-btn:active{transform:scale(.92)}

    /* ═══ WELCOME ═══ */
    .welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:12px}
    .welcome-icon{font-size:60px;animation:pulse 3s ease-in-out infinite}

    /* ═══ MESSAGES ═══ */
    #messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:3px}
    .msg-group{display:flex;gap:6px;align-items:flex-end;animation:slideUp .3s cubic-bezier(.34,1.56,.64,1)}
    .msg-group.own{flex-direction:row-reverse}
    .msg-group.gtop{margin-top:10px}
    .msg-avatar{width:28px;height:28px;border-radius:8px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--panel);color:var(--text);cursor:pointer;overflow:hidden}
    .msg-avatar img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
    .msg-ph{width:28px;flex-shrink:0}
    .msg-content{display:flex;flex-direction:column;max-width:70%}
    .msg-group.own .msg-content{align-items:flex-end}
    .msg-author{font-size:10px;color:var(--muted);margin-bottom:2px;padding:0 3px}
    .msg-bubble{padding:9px 13px;border-radius:var(--radius);font-size:14px;line-height:1.6;word-break:break-word;transition:transform .15s}
    .msg-bubble:active{transform:scale(.985)}
    .msg-bubble.own{background:var(--bubble-mine);color:var(--bubble-mine-text);border-bottom-left-radius:5px}
    .msg-bubble:not(.own){background:var(--bubble-other);color:var(--bubble-other-text);border:1px solid var(--border);border-bottom-right-radius:5px}
    .msg-bubble img{max-width:260px;max-height:260px;border-radius:10px;display:block;cursor:pointer;margin-top:4px}
    .msg-bubble video{max-width:260px;max-height:260px;border-radius:10px;display:block;margin-top:4px}
    .msg-bubble audio{max-width:220px;width:100%;margin-top:4px;border-radius:8px}
    .msg-bubble .file-link{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(255,255,255,.06);border-radius:8px;margin-top:4px;text-decoration:none;color:var(--text);font-size:12px}
    .msg-bubble .file-link:hover{background:rgba(255,255,255,.12)}
    .msg-meta{font-size:10px;color:var(--muted);margin-top:3px;padding:0 3px}
    .msg-group.own .msg-meta{text-align:left}
    .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:.4}
    .empty-icon{font-size:44px}.empty-txt{font-size:13px;color:var(--muted)}

    /* ═══ VOICE BAR ═══ */
    #voice-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:none;align-items:center;gap:12px;flex-shrink:0}
    #voice-bar.show{display:flex}
    .vb-members{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
    .vm-chip{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;background:var(--panel);border:1px solid var(--border);font-size:12px}
    .vm-chip.speaking{border-color:var(--green);background:rgba(34,197,94,.1);box-shadow:0 0 0 2px rgba(34,197,94,.15)}
    .vm-av{width:18px;height:18px;border-radius:5px;background:var(--panel);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .vm-name{color:var(--text);max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
    .vb-controls{display:flex;gap:6px;margin-right:auto}
    .vc-btn{width:30px;height:30px;border-radius:8px;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:13px;border:1px solid var(--border);transition:all var(--ease)}
    .vc-btn.muted{background:rgba(250,109,155,.1);border-color:var(--accent2)}
    .vb-join-btn{padding:7px 14px;border-radius:10px;font-size:13px;font-weight:600;background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.25);transition:transform .15s;white-space:nowrap}
    .vb-join-btn:hover{background:rgba(34,197,94,.22);transform:scale(1.04)}
    .vb-join-btn.leave{background:rgba(229,51,74,.1);color:var(--red);border-color:rgba(229,51,74,.25)}

    /* ═══ INPUT ═══ */
    #input-bar{padding:10px 14px 14px;background:var(--surface);border-top:1px solid var(--border);display:none;flex-direction:column;gap:8px;flex-shrink:0}
    #input-bar.show{display:flex}
    .irow{display:flex;gap:8px;align-items:flex-end}
    #msg-input{flex:1;padding:10px 14px;background:var(--panel);border:1.5px solid var(--border);border-radius:14px;font-size:14px;resize:none;max-height:110px;line-height:1.55;transition:border-color var(--ease)}
    #msg-input:focus{border-color:var(--accent)}
    #msg-input::placeholder{color:var(--muted)}
    .btn-send{width:42px;height:42px;border-radius:13px;flex-shrink:0;background:var(--accent);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;transition:transform .15s,box-shadow var(--ease);box-shadow:0 3px 12px rgba(124,109,250,.3)}
    .btn-send:hover{transform:scale(1.08) rotate(-8deg)}
    .btn-send:active{transform:scale(.9)}
    .btn-send.sent{animation:sendPop .3s}
    .attach-btn,.camera-btn{width:42px;height:42px;border-radius:13px;flex-shrink:0;background:var(--panel);border:1.5px solid var(--border);color:var(--text);font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;cursor:pointer}
    .attach-btn:hover,.camera-btn:hover{background:var(--border);transform:scale(1.08)}
    .media-preview{display:none;padding:6px 0 2px;position:relative}
    .media-preview img,.media-preview video{max-width:180px;max-height:120px;border-radius:10px;display:block}
    .cancel-media{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;line-height:1;cursor:pointer}

    /* ═══ PROFILE MODAL ═══ */
    #profile-overlay{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:210;display:none;align-items:center;justify-content:center;padding:20px;transition:background .25s}
    #profile-overlay.show{display:flex;background:rgba(0,0,0,.55)}
    #profile-card{background:var(--surface);border-radius:24px;width:100%;max-width:360px;max-height:88vh;overflow-y:auto;transform:scale(.9) translateY(20px);opacity:0;transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .25s}
    #profile-overlay.show #profile-card{transform:scale(1) translateY(0);opacity:1}
    .pf-header{position:relative;height:90px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:24px 24px 0 0;flex-shrink:0}
    .pf-close{position:absolute;top:10px;left:10px;width:32px;height:32px;border-radius:10px;background:rgba(0,0,0,.25);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
    .pf-close:hover{background:rgba(0,0,0,.4)}
    .pf-avatar-wrap{position:relative;width:84px;height:84px;border-radius:24px;margin:-42px auto 0;border:4px solid var(--surface);background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:38px;overflow:hidden}
    .pf-avatar-wrap img{width:100%;height:100%;object-fit:cover}
    .pf-upload-btn{position:absolute;bottom:-2px;left:-2px;width:28px;height:28px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;border:2px solid var(--surface);cursor:pointer;transition:transform .15s}
    .pf-upload-btn:hover{transform:scale(1.1)}
    .pf-upload-btn input{display:none}
    .pf-body{padding:14px 20px 22px;display:flex;flex-direction:column;align-items:center;gap:4px}

    .pf-email{font-size:12px;color:var(--muted)}

    .pf-role-badge.owner{background:rgba(124,109,250,.15);color:var(--accent)}
    .pf-role-badge.admin{background:rgba(250,109,155,.15);color:var(--accent2)}
    .pf-role-badge.user{background:var(--panel);color:var(--muted)}
    .pf-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:16px}
    .pf-stat{background:var(--panel);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;align-items:center}
    .pf-stat-val{font-size:18px;font-weight:700}
    .pf-stat-lbl{font-size:11px;color:var(--muted)}

    /* ═══ THEME PANEL ═══ */
    #theme-overlay{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:200;display:none;align-items:flex-end;justify-content:center;transition:background .25s}
    #theme-overlay.show{display:flex;background:rgba(0,0,0,.55)}
    #theme-panel{background:var(--surface);border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;transform:translateY(100%) scale(.96);opacity:0;transition:transform .42s cubic-bezier(.34,1.1,.4,1),opacity .3s}
    #theme-overlay.show #theme-panel{transform:translateY(0) scale(1);opacity:1}
    .tp-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
    .tp-title{font-size:16px;font-weight:700}
    .tp-body{overflow-y:auto;padding:14px 18px 24px;display:flex;flex-direction:column;gap:18px}
    .tp-section-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
    .tp-presets{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
    .tp-presets::-webkit-scrollbar{height:0}
    .preset-chip{flex-shrink:0;width:68px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:16px;border:1.5px solid var(--border);background:var(--panel);transition:all var(--ease);cursor:pointer}
    .preset-chip:hover{transform:scale(1.06);border-color:var(--accent)}
    .preset-chip.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(124,109,250,.25)}
    .preset-swatch{width:44px;height:44px;border-radius:12px;display:flex;overflow:hidden;position:relative}
    .preset-swatch span{flex:1;height:100%}
    .preset-label{font-size:10px;color:var(--muted);text-align:center}
    .preset-chip.preset-blackhole .preset-swatch{background:radial-gradient(circle at 50% 50%,#000 0% 35%,#ff6a00 55%,#000 80%)}
    .preset-blackhole-core{position:absolute;inset:0;z-index:2;border-radius:12px;overflow:hidden}
    .preset-blackhole-core::before{content:'';position:absolute;inset:0;background:conic-gradient(from 0deg,transparent 0deg,#ff6a00 60deg,transparent 120deg,#fff 180deg,transparent 240deg,#ff6a00 300deg,transparent 360deg);animation:blackholeSpin 2.5s linear infinite;opacity:.85}
    .preset-blackhole-core::after{content:'';position:absolute;inset:30%;border-radius:50%;background:#000;box-shadow:0 0 10px 3px rgba(255,106,0,.5)}
    .preset-chip.preset-blackhole:hover .preset-swatch{box-shadow:0 0 18px rgba(255,106,0,.7)}
    .preset-chip.preset-blackhole .preset-label{color:#ff6a00;font-weight:800;animation:blackholePulse 1.6s ease-in-out infinite}
    .tp-actions{display:flex;gap:8px;padding-top:6px}
    .tp-action-btn{flex:1;padding:11px;border-radius:12px;font-size:13px;font-weight:600;background:var(--panel);border:1px solid var(--border);transition:all var(--ease)}
    .tp-action-btn:hover{background:var(--border)}
    .tp-action-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none}

    /* ═══ CREATE ROOM MODAL ═══ */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:220}
    .modal-overlay.show{display:flex}
    .modal-card{background:var(--surface);border-radius:20px;padding:24px;width:90%;max-width:360px;border:1px solid var(--border);animation:scaleIn .2s}
    .modal-card h2{font:700 16px inherit;margin-bottom:16px}
    .modal-card input,.modal-card select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);font:13px inherit;margin-bottom:10px;outline:none}
    .modal-card input:focus{border-color:var(--accent)}
    .modal-btns{display:flex;gap:8px;margin-top:14px}
    .modal-btns .btn{flex:1;padding:10px;border-radius:10px;font:600 13px inherit;text-align:center}
    .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
    .btn-ghost{background:var(--panel);color:var(--muted);border:1px solid var(--border)}

    /* ═══ TOAST ═══ */
    #toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px) scale(.9);background:var(--panel);border:1px solid var(--border);padding:9px 18px;border-radius:99px;font-size:13px;opacity:0;transition:all .35s cubic-bezier(.34,1.56,.64,1);pointer-events:none;z-index:99;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.25)}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}

    /* ═══ MOBILE ═══ */
    .menu-btn{display:none;position:fixed;top:12px;right:12px;z-index:55}
    .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;backdrop-filter:blur(2px)}
    .sidebar-overlay.show{display:block}
    @media(max-width:768px){
      .sidebar{position:fixed;right:0;top:0;height:100%;width:260px;transform:translateX(100%)}
      .sidebar.open{transform:translateX(0)}
      .menu-btn{display:flex}
      .msg-content{max-width:82%}
      input,textarea{font-size:16px!important}
    }
  </style>
</head>

function renderThemePresets(){$('tp-presets').innerHTML='';Object.keys(THEMES).forEach(n=>{const t=THEMES[n];const c=document.createElement('button');c.className='preset-chip'+(curTheme===n?' active':'')+(n==='سیاه‌چاله'?' preset-blackhole':'');c.onclick=()=>{applyTheme(n);renderThemePresets()};c.innerHTML=`<div class="preset-swatch">${n==='سیاه‌چاله'?'<div class="preset-blackhole-core"></div>':`<span style="background:${t.bg}"></span><span style="background:${t.accent}"></span><span style="background:${t.accent2}"></span>`}</div><div class="preset-label">${n}</div>`;$('tp-presets').appendChild(c)})}
window.openThemePanel=()=>{renderThemePresets();$('theme-overlay').style.display='flex';requestAnimationFrame(()=>requestAnimationFrame(()=>$('theme-overlay').classList.add('show')))};
window.closeThemePanel=()=>{$('theme-overlay').classList.remove('show');setTimeout(()=>{if(!$('theme-overlay').classList.contains('show'))$('theme-overlay').style.display='none'},420)};
window.resetTheme=()=>{applyTheme('پیش‌فرض');renderThemePresets();toast('تم بازنشانی شد')};

// ═══ AUTH ═══
document.querySelectorAll('.auth-tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.auth-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');const t=b.dataset.tab;$('loginForm').classList.toggle('active',t==='login');$('registerForm').classList.toggle('active',t==='register');$('authErr').textContent='';$('authErr2').textContent=''}));

$('loginForm').onsubmit=async e=>{e.preventDefault();const email=$('loginEmail').value.trim(),pass=$('loginPass').value;if(!email||!pass){$('authErr').textContent='ایمیل و رمز رو پر کن';return}$('authErr').textContent='';const btn=$('loginForm').querySelector('.auth-btn');btn.disabled=true;btn.innerHTML='<span style="display:inline-block;animation:pulse 1s infinite">⏳</span>';const{error}=await db.auth.signInWithPassword({email,password:pass});if(error){$('authErr').textContent=error.message.includes('Invalid')?'ایمیل یا پسورد اشتباهه':error.message;btn.disabled=false;btn.textContent='ورود به GapChat ←';return}await loadSession()};

$('registerForm').onsubmit=async e=>{e.preventDefault();const name=$('regName').value.trim(),email=$('regEmail').value.trim(),pass=$('regPass').value;if(!name||!email||!pass){$('authErr2').textContent='همه فیلدها رو پر کن';return}$('authErr2').textContent='';const btn=$('registerForm').querySelector('.auth-btn');btn.disabled=true;btn.innerHTML='<span style="display:inline-block;animation:pulse 1s infinite">⏳</span>';const{data,error}=await db.auth.signUp({email,password:pass,options:{data:{display_name:name}}});if(error){$('authErr2').textContent=error.message.includes('already')?'این ایمیل قبلاً ثبت شده':error.message;btn.disabled=false;btn.textContent='ساخت حساب ←';return}if(data.user){const{count}=await db.from('profiles').select('*',{count:'exact',head:true});await db.from('profiles').insert({id:data.user.id,username:name,display_name:name,role:count===0?'owner':'user'})}$('authErr2').textContent='';toast('ثبت‌نام انجام شد! حالا وارد شو ✓');document.querySelectorAll('.auth-tab')[0].click();$('loginEmail').value=email;$('loginPass').value=pass;btn.disabled=false;btn.textContent='ساخت حساب ←'};

async function loadSession(){const{data:{user}}=await db.auth.getUser();if(!user)return;await new Promise(r=>setTimeout(r,200));let{data:profile}=await db.from('profiles').select('*').eq('id',user.id).single();if(!profile){const{count}=await db.from('profiles').select('*',{count:'exact',head:true});const un=user.user_metadata?.display_name||user.email.split('@')[0];await db.from('profiles').insert({id:user.id,username:un,display_name:un,role:count===0?'owner':'user'});({data:profile}=await db.from('profiles').select('*').eq('id',user.id).single())}if(profile){me=user;myProfile=profile;enterApp()}}

window.signOut=async()=>{if(!confirm('از حساب خارج بشی؟'))return;if(voiceChannel){await db.removeChannel(voiceChannel);voiceChannel=null}if(presenceChannel){await db.removeChannel(presenceChannel);presenceChannel=null}leaveVoice();await db.auth.signOut();me=null;myProfile=null;$('auth').style.display='flex';$('app').classList.remove('show');if(pollTimer)clearInterval(pollTimer)};

// ═══ APP ═══
function enterApp(){$('auth').style.display='none';$('app').classList.add('show');renderAvatar($('hav'),myProfile);const rn=myProfile.display_name||myProfile.username;$('hname').textContent=rn+(myProfile.role==='owner'?' 👑':'');const r=$('hrole');r.textContent=myProfile.role==='owner'?'مالک':myProfile.role==='admin'?'ادمین':'کاربر';r.className='sb-role '+myProfile.role;const isAdmin=['owner','admin'].includes(myProfile.role);$('addTextBtn').classList.toggle('show',isAdmin);$('addVoiceBtn').classList.toggle('show',isAdmin);loadRooms();startPresence()}

function renderAvatar(el,p){if(p?.avatar_url){el.innerHTML=`<img src="${esc(p.avatar_url)}" alt=""/>`}else{el.textContent=(p?.display_name||p?.username||'?').charAt(0).toUpperCase()}}

// ═══ PRESENCE ═══
async function startPresence(){if(presenceChannel)await db.removeChannel(presenceChannel);presenceChannel=db.channel('online-users');presenceChannel.on('presence',{event:'sync'},()=>renderOnline(presenceChannel.presenceState())).on('presence',{event:'join'},()=>renderOnline(presenceChannel.presenceState())).on('presence',{event:'leave'},()=>renderOnline(presenceChannel.presenceState()));await presenceChannel.subscribe(async s=>{if(s==='SUBSCRIBED')await presenceChannel.track({user_id:me.id,username:myProfile.username,display_name:myProfile.display_name,online_at:new Date().toISOString()})})}
function renderOnline(state){const l=$('onlineList');l.innerHTML='';const seen=new Set();for(const[,p]of Object.entries(state)){for(const u of p){if(seen.has(u.user_id))continue;seen.add(u.user_id);const d=document.createElement('div');d.className='online-item';const s=u.user_id===me.id?' (شما)':'';d.innerHTML=`<span class="online-dot"></span><span>${esc(u.display_name||u.username)}${s}</span>`;l.appendChild(d)}}}

// ═══ ROOMS ═══
async function loadRooms(){const{data}=await db.from('rooms').select('*').order('created_at');$('textRooms').innerHTML='';$('voiceRooms').innerHTML='';if(!data)return;data.forEach(r=>{const d=document.createElement('div');d.className='room-item';d.dataset.id=r.id;const icon=r.type==='voice'?'<i class="fas fa-volume-up"></i>':'<i class="fas fa-comment"></i>';d.innerHTML=`${icon}<span>${esc(r.name)}</span>`;d.onclick=()=>openRoom(r.id,r.name,r.type);(r.type==='voice'?$('voiceRooms'):$('textRooms')).appendChild(d)})}

window.openCreateRoom=(type)=>{$('newRoomType').value=type;$('createRoomModal').classList.add('show')};
window.closeModal=(id)=>{$(id).classList.remove('show')};

window.createRoom=async()=>{const name=$('newRoomName').value.trim(),type=$('newRoomType').value;if(!name)return;await db.from('rooms').insert({name,type,created_by:me.id});$('createRoomModal').classList.remove('show');$('newRoomName').value='';loadRooms();toast('✅ اتاق ساخته شد')};

// ═══ MESSAGES ═══
let msgSub=null;
async function openRoom(id,name,type){if(msgSub){await db.removeChannel(msgSub);msgSub=null}curRoom=id;curType=type;$('welcome').style.display='none';$('messages').style.display='flex';$('chatHeader').style.display='flex';$('roomTitle').textContent=name;const b=$('roomBadge');b.textContent=type==='voice'?'صوتی':'متنی';b.className='chat-badge'+(type==='voice'?' voice':'');$('input-bar').classList.toggle('show',type==='text');$('voiceActions').style.display=type==='voice'?'flex':'none';$('voice-bar').classList.toggle('show',type==='voice');document.querySelectorAll('.room-item').forEach(el=>el.classList.toggle('active',el.dataset.id===id));closeSidebar();if(type==='text'){const{data}=await db.from('messages').select('*, profiles:user_id (id,username,display_name,role,avatar_url)').eq('room_id',id).order('created_at').limit(100);$('messages').innerHTML='';if(data)data.forEach(m=>addMsg(m));scrollBottom();lastMsgTime=data&&data.length?data[data.length-1].created_at:null;msgSub=db.channel('room:'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`room_id=eq.${id}`},async p=>{const{data}=await db.from('messages').select('*, profiles:user_id (id,username,display_name,role,avatar_url)').eq('id',p.new.id).single();if(data)addMsg(data)}).subscribe()}}

function addMsg(m){const c=$('messages');const d=document.createElement('div');const own=m.user_id===me?.id;const u=m.profiles;const time=new Date(m.created_at).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});let content='';if(m.type==='text')content=esc(m.content);else if(m.type==='image')content=`<img src="${m.file_url}" loading="lazy" onclick="window.open('${m.file_url}','_blank')">`;else if(m.type==='video')content=`<video src="${m.file_url}" controls style="max-width:260px;max-height:260px;border-radius:10px"></video>`;else if(m.type==='voice')content=`<audio controls src="${m.file_url}" style="max-width:220px"></audio>`;else if(m.type==='file')content=`<a href="${m.file_url}" class="file-link" target="_blank"><i class="fas fa-file"></i> ${esc(m.file_name||'فایل')}</a>`;d.className=`msg-group ${own?'own':''}`;d.innerHTML=`<div class="msg-avatar" onclick="openProfile('${esc(u?.display_name||'?')}')" style="background:${own?'var(--accent)':'linear-gradient(135deg,var(--green),#16a34a)'}">${u?.avatar_url?`<img src="${esc(u.avatar_url)}" alt=""/>`:(u?.display_name||'?').charAt(0).toUpperCase()}</div><div class="msg-content"><div class="msg-author">${esc(u?.display_name||'ناشناس')}</div><div class="msg-bubble${own?' own':''}">${content}</div><div class="msg-meta">${time}</div></div>`;c.appendChild(d)}
function scrollBottom(){const c=$('messages');requestAnimationFrame(()=>{c.scrollTop=c.scrollHeight})}

window.sendMsg=async function(){const inp=$('msg-input');const text=inp.value.trim();if((!text&&!pendingMediaFile)||!me||!curRoom)return;if(pendingMediaFile){await sendMedia(inp,text);return}inp.value='';inp.style.height='';const sb=$('sendBtn');sb.classList.remove('sent');void sb.offsetWidth;sb.classList.add('sent');await db.from('messages').insert({room_id:curRoom,user_id:me.id,type:'text',content:text})};

// ═══ MEDIA ═══
$('mediaInput').addEventListener('change',function(){const f=this.files[0];if(!f)return;if(f.size>50*1024*1024){toast('حداکثر ۵۰ مگابایت');this.value='';return}pendingMediaFile=f;pendingMediaIsVideo=f.type.startsWith('video/');const url=URL.createObjectURL(f);if(pendingMediaIsVideo){$('prevVid').src=url;$('prevVid').style.display='block';$('prevImg').style.display='none'}else{$('prevImg').src=url;$('prevImg').style.display='block';$('prevVid').style.display='none'}$('mediaPreview').style.display='block';this.value=''});
$('cameraInput').addEventListener('change',function(){const f=this.files[0];if(!f)return;pendingMediaFile=f;pendingMediaIsVideo=false;$('prevImg').src=URL.createObjectURL(f);$('prevImg').style.display='block';$('prevVid').style.display='none';$('mediaPreview').style.display='block';this.value=''});
window.cancelMedia=()=>{pendingMediaFile=null;$('mediaPreview').style.display='none';$('prevImg').src='';$('prevVid').src=''};

async function sendMedia(inp,caption){const file=pendingMediaFile,isV=pendingMediaIsVideo;cancelMedia();inp.value='';inp.style.height='';const ext=(file.name.split('.').pop()||(isV?'mp4':'jpg')).toLowerCase().replace(/[^a-z0-9]/g,'');const path=`${Date.now()}.${ext||'jpg'}`;const bucket=isV?'chat-videos':'chat-images';try{toast('⏳ در حال آپلود…');const{error:ue}=await db.storage.from(bucket).upload(path,file,{upsert:true});if(ue)throw ue;const{data:ud}=db.storage.from(bucket).getPublicUrl(path);const type=isV?'video':file.type.startsWith('image/')?'image':file.type.startsWith('audio/')?'voice':'file';await db.from('messages').insert({room_id:curRoom,user_id:me.id,type,content:caption||file.name,file_url:ud.publicUrl,file_name:file.name,file_size:file.size});toast('✅ ارسال شد')}catch(e){toast('❌ خطا: '+e.message)}}

// ═══ VOICE ═══
async function joinVoice(){try{myStream=await navigator.mediaDevices.getUserMedia({audio:true});$('joinVoiceBtn').style.display='none';$('leaveVoiceBtn').style.display='inline-flex';$('vbControls').style.display='flex';voiceChannel=db.channel('voice:'+curRoom);voiceChannel.on('broadcast',{event:'join'},async({payload})=>{if(payload.userId===me.id)return;await createPeer(payload.userId,true)}).on('broadcast',{event:'offer'},async({payload})=>{if(payload.to!==me.id)return;await handleOffer(payload.from,payload.offer)}).on('broadcast',{event:'answer'},async({payload})=>{if(payload.to!==me.id)return;await handleAnswer(payload.from,payload.answer)}).on('broadcast',{event:'ice'},async({payload})=>{if(payload.to!==me.id)return;await handleIce(payload.from,payload.candidate)}).on('broadcast',{event:'leave'},({payload})=>{if(peers.has(payload.userId)){peers.get(payload.userId).close();peers.delete(payload.userId)}}).subscribe();await voiceChannel.send({type:'broadcast',event:'join',payload:{userId:me.id,username:myProfile.display_name||myProfile.username}});renderVoiceMembers()}catch(e){toast('❌ دسترسی میکروفون رد شد')}}
function leaveVoice(){if(voiceChannel){voiceChannel.send({type:'broadcast',event:'leave',payload:{userId:me.id}});db.removeChannel(voiceChannel);voiceChannel=null}if(myStream){myStream.getTracks().forEach(t=>t.stop());myStream=null}peers.forEach(pc=>pc.close());peers.clear();$('joinVoiceBtn').style.display='inline-flex';$('leaveVoiceBtn').style.display='none';$('vbControls').style.display='none';$('vbMembers').innerHTML='<span style="font-size:12px;color:var(--muted);font-style:italic">کسی اینجا نیست</span>'}
async function createPeer(peerId,initiator){const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});peers.set(peerId,pc);if(myStream)myStream.getTracks().forEach(t=>pc.addTrack(t,myStream));pc.onicecandidate=e=>{if(e.candidate)voiceChannel.send({type:'broadcast',event:'ice',payload:{from:me.id,to:peerId,candidate:e.candidate}})};pc.ontrack=()=>{};if(initiator){const offer=await pc.createOffer();await pc.setLocalDescription(offer);voiceChannel.send({type:'broadcast',event:'offer',payload:{from:me.id,to:peerId,offer}})}return pc}
async function handleOffer(from,offer){const pc=await createPeer(from,false);await pc.setRemoteDescription(new RTCSessionDescription(offer));const answer=await pc.createAnswer();await pc.setLocalDescription(answer);voiceChannel.send({type:'broadcast',event:'answer',payload:{from:me.id,to:from,answer}})}
async function handleAnswer(from,answer){const pc=peers.get(from);if(pc)await pc.setRemoteDescription(new RTCSessionDescription(answer))}
async function handleIce(from,candidate){const pc=peers.get(from);if(pc)try{await pc.addIceCandidate(new RTCIceCandidate(candidate))}catch{}}
function toggleMute(){if(!myStream)return;const a=myStream.getAudioTracks()[0];if(a){a.enabled=!a.enabled;$('muteBtn').innerHTML=a.enabled?'<i class="fas fa-microphone"></i>':'<i class="fas fa-microphone-slash"></i>'}}
function renderVoiceMembers(){$('vbMembers').innerHTML='';peers.forEach((pc,id)=>{const d=document.createElement('div');d.className='vm-chip';d.innerHTML=`<div class="vm-av">👤</div><span class="vm-name">کاربر</span>`;$('vbMembers').appendChild(d)})}

// ═══ PROFILE ═══
window.openProfile=async function(name){$('profile-overlay').classList.add('show');$('profile-body').innerHTML='<div style="padding:30px;text-align:center;color:var(--muted)">در حال بارگذاری…</div>';const{data}=await db.from('profiles').select('*').eq('display_name',name).single();if(!$('profile-overlay').classList.contains('show'))return;if(!data){$('profile-body').innerHTML='<div style="padding:30px;text-align:center;color:var(--muted)">کاربر پیدا نشد</div>';return}const{count:mc}=await db.from('messages').select('*',{count:'exact',head:true}).eq('user_id',data.id);const isMe=data.id===me?.id;const rn=data.role==='owner'?'مالک':data.role==='admin'?'ادمین':'کاربر';const avHtml=data.avatar_url?`<img src="${esc(data.avatar_url)}" alt=""/>`:(data.display_name||'?').charAt(0).toUpperCase();let uploadBtn='';if(isMe)uploadBtn=`<label class="pf-upload-btn" title="تغییر آواتار"><i class="fas fa-camera"></i><input type="file" accept="image/*" onchange="uploadAvatar(this)"></label>`;$('profile-body').innerHTML=`<div class="pf-avatar-wrap">${avHtml}${uploadBtn}</div><div class="pf-name">${esc(data.display_name||data.username)}</div><div class="pf-email">${esc(data.username)}</div><span class="pf-role-badge ${data.role}">${rn}</span><div class="pf-stats"><div class="pf-stat"><div class="pf-stat-val">${mc||0}</div><div class="pf-stat-lbl">پیام</div></div><div class="pf-stat"><div class="pf-stat-val">${new Date(data.created_at).toLocaleDateString('fa-IR')}</div><div class="pf-stat-lbl">عضویت</div></div></div>`};
window.uploadAvatar=async function(input){const file=input.files[0];if(!file)return;if(file.size>5*1024*1024){toast('حداکثر ۵ مگابایت');return}try{toast('⏳ در حال آپلود…');const ext=file.name.split('.').pop().toLowerCase().replace(/[^a-z0-9]/g,'');const path=`avatar_${me.id}.${ext}`;const{error}=await db.storage.from('avatars').upload(path,file,{upsert:true});if(error)throw error;const{data:ud}=db.storage.from('avatars').getPublicUrl(path);await db.from('profiles').update({avatar_url:ud.publicUrl}).eq('id',me.id);myProfile.avatar_url=ud.publicUrl;renderAvatar($('hav'),myProfile);openProfile(myProfile.display_name||myProfile.username);toast('✅ آواتار آپدیت شد')}catch(e){toast('❌ خطا: '+e.message)}};
window.openMyProfile=()=>{if(myProfile)openProfile(myProfile.display_name||myProfile.username)};
window.closeProfile=()=>$('profile-overlay').classList.remove('show');

// ═══ MOBILE ═══
function closeSidebar(){$('sidebar').classList.remove('open');$('sidebarOverlay').classList.remove('show')}
$('menuBtn').onclick=()=>{$('sidebar').classList.add('open');$('sidebarOverlay').classList.add('show')};
$('sidebarOverlay').onclick=closeSidebar;

// ═══ INPUT ═══
$('msg-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}});
$('msg-input').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,110)+'px'});

// ═══ HELPERS ═══
function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500)}

// ═══ INIT ═══
applyTheme(curTheme);
loadSession();
</script>
</body>
</html>
